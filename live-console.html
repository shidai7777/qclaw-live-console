/* 账号字段改动落到用户覆盖层：
   applySnapshot 每次都会用 workbench_data.json 整体重建 accounts，
   不落到覆盖层的改动（新增 or 编辑）下次数据刷新就没了。 */
function persistAccEdit(a,oldName){
  if(!DB.accAdd)DB.accAdd=[];
  if(!DB.accPatch)DB.accPatch=[];
  var k=normK(oldName||a.name);
  var inAdd=false;
  DB.accAdd.forEach(function(x){
    if(normK(x.name)!==k)return;
    inAdd=true;
    ACC_FIELDS.forEach(function(f){x[f]=a[f];});
  });
  if(inAdd)return;
  /* 快照里来的账号：记一条字段补丁，刷新后由 applyUserOverrides 重新套上 */
  DB.accPatch=DB.accPatch.filter(function(p){return normK(p.name)!==k;});
  var p={};
  ACC_FIELDS.forEach(function(f){p[f]=a[f];});
  DB.accPatch.push(p);
}

/* 新增时同步写一份进 accAdd，否则 applySnapshot 一重建就丢了 */
function persistAccAdd(a){
  if(!DB.accAdd)DB.accAdd=[];
  var r={};
  ACC_FIELDS.forEach(function(f){r[f]=a[f];});
  DB.accAdd.push(r);
}

var ACC_FIELDS=['name','sheet','operator','plat','cat','liveTime','guard','auto','week','note','fanBase','clubBase','baseDate'];

function saveAcc(id){

  var name=val('a_name');

  if(!name){toast('账号名称不能为空');return;}

  var old=id?accById(id):null;

  if(!old){
    var dup=false,nk=normK(name);
    DB.accounts.forEach(function(x){if(normK(x.name)===nk)dup=true;});
    if(!DB.accAdd)DB.accAdd=[];
    DB.accAdd.forEach(function(x){if(normK(x.name)===nk)dup=true;});
    if(dup){toast('该账号已存在');return;}
  }

  var a=old||{id:uid()};

  var oldName=old?old.name:'';

  a.name=name;a.sheet=val('a_sheet')||name;a.operator=val('a_operator');a.plat=val('a_plat');

  a.cat=val('a_cat')||'';

  a.liveTime=val('a_liveTime');a.guard=val('a_guard');a.auto=val('a_auto');

  /* 粉丝量基线：留空存 null（不显示粉丝量），填了就按数字存 */
  a.fanBase =val('a_fanBase')===''?null:(+val('a_fanBase')||0);
  a.clubBase=old?old.clubBase:null;  /* 粉丝团显示已下线，保留旧数据不丢 */
  a.baseDate=val('a_baseDate')||'';

  a.auth=val('a_auth');a.lastGuard=val('a_lg');a.note=val('a_note');

  var ds=[];

  Array.prototype.forEach.call(document.querySelectorAll('#a_dow button.on'),function(b){ds.push(+b.getAttribute('data-d'));});

  a.week=ds;

  if(!old){
    DB.accounts.push(a);
    a.custom=true;
    persistAccAdd(a);
  }else{
    persistAccEdit(a,oldName);
  }

  save();closeModal();render();toast('账号已保存');

}

function delAcc(id){

  var a=accById(id);if(!a)return;

  var n=DB.sessions.filter(function(s){return s.acc===id;}).length;

  modal('<h3>删除账号「'+esc(a.name)+'」？</h3><div class="sub">该账号下有 '+n+' 条场次数据，会移到「已归档」保留可查，可随时恢复。<b>不会改动主表与守护矩阵。</b></div>'

   +'<div class="frow"><button class="btn danger lg" onclick="doDelAcc(\''+id+'\')">确认删除</button><button class="btn ghost lg" onclick="closeModal()">取消</button></div>');

}

function doDelAcc(id){

  var a=accById(id);

  if(a){
    if(a.custom){
      /* 自己新增的：从新增覆盖层抹掉，不留归档垃圾 */
      if(DB.accAdd)DB.accAdd=DB.accAdd.filter(function(x){return normK(x.name)!==normK(a.name);});
    }else{
      /* 快照账号：记进删除覆盖层 + 移入已归档，否则下次数据刷新又冒出来 */
      if(!DB.accDel)DB.accDel=[];
      if(DB.accDel.indexOf(normK(a.name))<0)DB.accDel.push(normK(a.name));
      if(DB.accPatch)DB.accPatch=DB.accPatch.filter(function(p){return normK(p.name)!==normK(a.name);});
      for(var j=DB.sessions.length-1;j>=0;j--){
        if(DB.sessions[j].acc===id){DB.sessionsArch.push(DB.sessions[j]);DB.sessions.splice(j,1);}
      }
      a.status='terminated';
      a.archivedDate=a.archivedDate||today();
      a.archiveNote=a.archiveNote||'手机端手动删除（终止合作）· 历史场次保留';
      DB.accountsArch.push(a);
    }
  }

/* ============ 视图：复盘报告 ============ */

function pipeSlot(liveTime){

  if(!liveTime)return 'deep';

  var m=liveTime.match(/(\d{1,2}):/);var h=m?+m[1]:19;

  if(h<12)return 'am';

  if(h<18)return 'pm';

  return 'deep';

}

   与「场次数据」分工：场次数据看硬指标，复盘报告看结论与稿子。

/* 这场挂的逐字稿（没挂返回 null） */
function ctTr(s){ return (s&&s.tr!=null&&(DB.transcripts||[])[s.tr])?(DB.transcripts||[])[s.tr]:null; }

  var from = ctRange==='0' ? '' : dateAdd(today(),-(+ctRange));
  var list=all.filter(function(s){

    if(ctStat==='done'&&!done)return false;
    if(ctStat==='has'&&!t)return false;

     +(isTop?'<span class="pill" style="background:#FEF3C7;color:#92400E;border:1px solid #FDE68A">数据最优</span>':'')

     +scoreTxt

     +(r.done?'<span class="pill ok">已复盘</span>':'<span class="pill warn">待复盘</span>')
     +(t?'<span class="pill grey">逐字稿</span>':'<span class="pill grey">无稿</span>')
     +((t&&t.riskN>0)?('<span class="pill warn">⚠ '+t.riskN+' 处</span>'):'')

     +'<span style="flex:1"></span>'

     +(r.done
         ? '<button class="btn sm ghost" onclick="openReview(\''+s.id+'\')">'+svg('edit')+'修改</button>'
           + '<button class="btn sm pri" onclick="showReport(\''+s.id+'\')">'+svg('share')+'查看报告</button>'
         : '<button class="btn sm pri" onclick="openReview(\''+s.id+'\')">'+svg('edit')+'写复盘</button>'
     )
     +'<button class="btn sm ghost" onclick="openSessionAggregate(\''+s.id+'\',\'data\')">'+svg('grid')+'详情</button>'
     +'</div>';

    /* 核心数据小卡：最高在线 / 最高进入 / 累计观看 / 涨粉 / 曝光 + 环比箭头 */

    var prev=prevSession(s);

    h+='<div class="grid6 grid5" style="margin-top:10px">'

     + cellD('最高在线',s.peak,prev&&prev.peak)+cellD('最高进入',s.enter,prev&&prev.enter)+cellD('累计观看',s.views,prev&&prev.views)+cellD('涨粉',s.fans,prev&&prev.fans)+cellD('曝光',s.expose,prev&&prev.expose)

     +'</div>';

    if(prev){

      h+='<div class="hint" style="margin-top:6px;font-size:11px;color:var(--tx3)">↕ 环比基准：'+esc(accName(prev.acc))+' · '+prev.date+' '+DOWN[dow(prev.date)]+'（同账号上一场）</div>';

    }

    if(r.done&&(r.highlight||r.problem||r.next)){

      h+='<div class="hint" style="margin-top:9px;line-height:1.8">'

       +(r.highlight?'<div><b style="color:var(--green)">亮点</b>　'+esc(r.highlight)+'</div>':'')

       +(r.problem?'<div><b style="color:var(--red)">问题</b>　'+esc(r.problem)+'</div>':'')

       +(r.next?'<div><b style="color:var(--pri)">建议</b>　'+esc(r.next)+'</div>':'')

       +'</div>';

    }

    h+='</div>';

  });

  h+='</div>';

  return h;

}

function quickRevDate(q){

  var t=today();

  if(q==='today'){filterRevFrom=t;filterRevTo=t;}

  else if(q==='7d'){filterRevFrom=dateAdd(t,-6);filterRevTo=t;}

  else if(q==='30d'){filterRevFrom=dateAdd(t,-29);filterRevTo=t;}

  else{filterRevFrom='';filterRevTo='';}

  render();

}

function prevSession(s){

  var arr=DB.sessions.filter(function(x){return x.acc===s.acc&&x.date<s.date;}).sort(function(a,b){return a.date<b.date?1:-1;});

  return arr[0]||null;

}

function pctText(cur,prev){

  if(!prev||!prev)return '';

  var p=(cur-prev)/prev*100;

  return '（环比 '+(p>=0?'+':'')+p.toFixed(1)+'%）';

}

function buildReport(s){

  var a=accName(s.acc),p=prevSession(s),r=s.review||{},acc=accById(s.acc);

  var L=[];

  L.push('【直播复盘】'+a+' · '+s.date+' '+DOWN[dow(s.date)]+(acc?'　类目：'+catLabel(acc):''));

  L.push('时段：开播 '+(s.liveTime||'--')+(s.dur?'（'+s.dur+'）':'')+'　守护节点：'+pipeSlot(s.liveTime));

  L.push('');

  L.push('一、核心数据');

  L.push('- 最高在线：'+num(s.peak)+' 人 '+(p?pctText(s.peak,p.peak):''));

  L.push('- 最高进入：'+num(s.enter)+' 人 '+(p?pctText(s.enter,p.enter):''));

  L.push('- 曝光量：'+num(s.expose)+' '+(p?pctText(s.expose,p.expose):''));

  L.push('- 累计观看：'+num(s.views)+' 人次 '+(p?pctText(s.views,p.views):''));

  L.push('- 平均在线：'+num(s.avgOnline)+' 人');

  L.push('- 新增粉丝：'+num(s.fans)+' 人 '+(p?pctText(s.fans,p.fans):''));

  L.push('- 新加团：'+num(s.teamAdd)+' 人');

  if(s.gmv||s.orders){

    L.push('- GMV：'+money(s.gmv)+'　成交件数：'+num(s.orders)+'　成交人数：'+num(s.buyers));

    L.push('- 千次观看GMV：¥'+(s.thousandGmv||(s.views?(s.gmv/s.views*1000).toFixed(2):'0.00'))+'　转化率：'+(s.conv||(s.views?(s.orders/s.views*100).toFixed(2):'0.00'))+'%');

  }

  L.push('');

  L.push('二、流量结构');

  L.push('- 曝光-观看率：'+(s.expViewRate||'-')+'%　观看-关注率：'+(s.viewFanRate||'-')+'%　观看-互动率：'+(s.viewInterRate||'-')+'%');

  L.push('- 流量来源：直播推荐 '+(s.flowRec||'-')+'% · 关注 '+(s.flowFollow||'-')+'% · 搜索 '+(s.flowSearch||'-')+'% · 短视频 '+(s.flowShort||'-')+'% · 首页 '+(s.flowHome||'-')+'%');

  L.push('- 预告引流：'+num(s.trail)+(s.bagRounds?'　福袋 '+s.bagRounds+' 轮 / '+num(s.bagUsers)+' 人参与':''));

  if(p)L.push('（对比场次：'+p.date+'）');

  L.push('');

  L.push('三、话术合规扫描');
  var _t=(DB.transcripts||[])[s.tr];
  if(_t&&_t.riskN>0){
    var _h=0,_m=0;(_t.risk||[]).forEach(function(x){if(x.lv==='high')_h+=x.n;else _m+=x.n;});
    L.push('全段合并口径，检出 '+_t.riskN+' 种词（🔴高 '+_h+' 处 / 🟡中 '+_m+' 处，关键词粗筛，人工复核为准）：');
    (_t.risk||[]).forEach(function(x){L.push('- '+(x.lv==='high'?'🔴':'🟡')+' '+x.w+' ×'+x.n);});
  }else if(_t){
    L.push('未检出违规词（关键词粗筛，人工复核为准）。');
  }else{
    L.push('本场暂无逐字稿，跳过扫描。');
  }

  L.push('');

  L.push('四、亮点');

  L.push(r.highlight?r.highlight:'（待填写）');

  L.push('');

  L.push('五、问题');

  L.push(r.problem?r.problem:'（待填写）');

  L.push('');

  L.push('六、建议');

  L.push(r.next?r.next:'（待填写）');

  var mat=[];

  if(s.video)mat.push('回放视频：'+s.video);

  if(s.audio)mat.push('音频：'+s.audio);

  if(s.doc)mat.push('文字资料：'+s.doc);

  if(mat.length){L.push('');L.push('七、素材归档');mat.forEach(function(m){L.push('- '+m);});}

  if(s.note){L.push('');L.push('备注：'+s.note);}

  return L.join('\n');

}

function openReview(id){

  var s=sesById(id);if(!s)return;

  var r=s.review||{done:false,highlight:'',problem:'',next:''};

  var p=prevSession(s);

  var dline=p?('<div class="hint" style="margin-bottom:12px">对比上一场（'+p.date+'）：最高在线 '+num(s.peak)+' '+pctText(s.peak,p.peak)+'　累计观看 '+num(s.views)+' '+pctText(s.views,p.views)+'</div>'):'';

  var pipeInfo='<div class="hint" style="margin-bottom:12px">本场属「'+({am:'上午场',pm:'下午场',deep:'深夜场'}[pipeSlot(s.liveTime)])+'」，复盘节点 '+(pipeSlot(s.liveTime)==='am'?'12:00':(pipeSlot(s.liveTime)==='pm'?'18:00':'23:00'))+' 前完成。</div>';

  modal('<h3>'+esc(accName(s.acc))+' · '+s.date+' 复盘</h3><div class="sub">最高在线 '+num(s.peak)+' 人 · 累计观看 '+num(s.views)+' 人次 · 曝光 '+num(s.expose)+'</div>'

   +pipeInfo+dline

   +'<div class="form"><div class="f full"><label>亮点（这场做对了什么）</label><textarea id="r_h">'+esc(r.highlight)+'</textarea></div>'

   +'<div class="f full"><label>问题（哪里掉链子）</label><textarea id="r_p">'+esc(r.problem)+'</textarea></div>'

   +'<div class="f full"><label>建议（下场具体怎么改）</label><textarea id="r_n">'+esc(r.next)+'</textarea></div></div>'

   +'<div class="frow"><button class="btn pri lg" onclick="saveReview(\''+id+'\',true)">'+svg('check')+'保存并标记完成</button>'

   +'<button class="btn lg" onclick="saveReview(\''+id+'\',false)">仅保存草稿</button>'

   +'<button class="btn ghost lg" onclick="closeModal()">取消</button></div>');

}

function saveReview(id,done){

  var s=sesById(id);if(!s)return;

  s.review={done:!!done,highlight:val('r_h'),problem:val('r_p'),next:val('r_n'),updated:today()};

  save();closeModal();render();toast(done?'复盘已完成':'草稿已保存');

}

function showReport(id){

  var s=sesById(id);if(!s)return;

  var txt=buildReport(s);

  window._rpt=txt;

  window._rptName='复盘_'+accName(s.acc)+'_'+s.date+'.md';

  modal('<h3>复盘报告 · 可直接共享</h3><div class="sub">'+esc(accName(s.acc))+' · '+s.date+'</div>'

   +'<div class="report" id="rptBox">'+fmtReport(txt)+'</div>'

   +'<div class="frow"><button class="btn pri lg" onclick="copyTxt(window._rpt)">'+svg('copy')+'复制全文</button>'

   +'<button class="btn ghost lg" onclick="closeModal()">关闭</button></div>');

}

function aggSwitch(v){
  var map={data:'aggData',review:'aggReview',script:'aggScript'};
  for(var k in map){var el=document.getElementById(map[k]);if(el)el.style.display=(k===v?'block':'none');}
  var bs=document.querySelectorAll('.agg-tab');
  for(var i=0;i<bs.length;i++){bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===v);}
}

function aggScriptHTML(s, trI){
  var t=null;
  if(s&&s.tr!=null)t=(DB.transcripts||[])[s.tr];
  else if(trI!=null)t=(DB.transcripts||[])[trI];
  if(!t)return '<div class="empty" style="padding:20px 0">'+svg('inbox')+'本场无逐字稿</div>';
  _trCurTxt=String(t.text||''); _trCurCut=!!t.cut;
  var h='';
  /* 一、逐字稿概况 */
  h+='<div style="font-weight:700;font-size:14px;color:var(--tx);margin:2px 0 8px">一、逐字稿概况</div>';
  h+='<div class="grid6">'
    +cell('字数',num(t.chars))
    +cell('时长',(t.dur?t.dur+' 分':'—'))
    +cell('风险词',(t.riskN>0?('<span style="color:#DC2626;font-weight:600">'+t.riskN+' 种</span>'):'无'))
    +'</div>';
  /* 二、话术合规扫描 */
  h+='<div style="font-weight:700;font-size:14px;color:var(--tx);margin:16px 0 6px">二、话术合规扫描</div>';
  if(t.riskN>0){
    var _h=0,_m=0;(t.risk||[]).forEach(function(x){if(x.lv==='high')_h+=x.n;else _m+=x.n;});
    h+='<div class="hint">全段合并口径，检出 '+t.riskN+' 种词（🔴高 '+_h+' 处 / 🟡中 '+_m+' 处，关键词粗筛，人工复核为准）</div>';
    /* 2026-09-09 师兄拍板：合并原「四、改写速查」——每词直接给逐字稿原文上下句，
       改写建议只有词库给了真实改写才显示（通用占位「删除或改写」不占版面） */
    (t.risk||[]).forEach(function(r){
      var realSug=r.s&&r.s.indexOf('删除或改写')<0;
      h+='<div class="tr-riskbox" style="margin-top:8px">'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
        +'<span class="pill '+(r.lv==='high'?'fail':'warn')+'">'+esc(r.w)+' ×'+r.n+'</span>'
        +'<span style="font-size:11px;color:#8A5A08">'+esc(r.c||'')+'</span>'
        +(realSug?'<span style="font-size:12px;color:#0F6E56;margin-left:auto">改写：'+esc(r.s)+'</span>':'')
        +'</div>';
      (r.snips||[]).slice(0,2).forEach(function(sn){
        h+='<div style="font-size:12px;color:var(--tx2);margin-top:5px;line-height:1.55">…'+esc(sn)+'…</div>';
      });
      if(!(r.snips||[]).length&&!realSug)h+='<div class="hint" style="margin-top:4px">（无原文片段，全文见逐字稿）</div>';
      h+='</div>';
    });
  } else {
    h+='<div class="hint">未检出违规词（关键词粗筛，人工复核为准）。</div>';
  }
  /* 三、互动引导节拍（2026-09-09 A+C 改版：热力带+空窗+密度+基准+点格展开原话+合规粗筛） */
  if(t.inter){
    h+='<div style="font-weight:700;font-size:14px;color:var(--tx);margin:16px 0 6px">三、互动引导节拍</div>';
    var IH=t.interHits||[],GAP=t.interGap||0,GAPAT=t.interGapAt||0,TDUR=t.dur||0;
    var _den=TDUR>=10?(t.interN/(TDUR/10)):0;
    var _bobj=DB.interBase||{};
    var _nacc=String(t.acc||'').replace(/（/g,'(').replace(/）/g,')').replace(/：/g,':');
    var _base=0;
    Object.keys(_bobj).forEach(function(k){var k2=String(k).replace(/（/g,'(').replace(/）/g,')').replace(/：/g,':');if(k2===_nacc)_base=_bobj[k];});
    var _con='全场 <b>'+num(t.interN)+'</b> 次引导 · 密度 <b>'+(_den?_den.toFixed(1):'—')+'</b> 次/10分';
    if(_base)_con+='（本账号历史基准 '+_base.toFixed(1)+'，'+(_den>=_base?'▲ 高于':'▼ 低于')+'历史）';
    _con+=GAP>=10?(' · <span style="color:#DC2626;font-weight:600">最长空窗 '+GAP+' 分钟（第 '+GAPAT+'′ 起）</span>'):(' · 无 10 分钟以上空窗');
    h+='<div class="hint">'+_con+'</div>';
    if(t.interRiskN>0)h+='<div class="hint" style="color:#B45309">引导话术检出 '+t.interRiskN+' 处风险表述（粗筛），原文见上方「话术合规扫描」，人工复核为准。</div>';
    var grpDef=[['关注引导','关注'],['灯牌/粉丝团','灯牌团'],['福利钩子','福利钩子'],['扣字互动','扣字']];
    var cs=t.inter||{};
    h+='<div class="grid6" style="margin-top:8px">';
    grpDef.forEach(function(g){h+=cell(g[1],num(cs[g[0]]||0));});
    h+='</div>';
    var bk={};
    if(IH.length){IH.forEach(function(x){var b=Math.floor(x.m/15)*15;bk[b]=(bk[b]||0)+1;});}
    else{var ob=t.interB||{};Object.keys(ob).forEach(function(k){bk[+k]=ob[k];});}
    /* 补零桶：空窗时段（0 次引导）也占一格标红，时间轴连续、冷场一眼可见 */
    var _bmax=0;Object.keys(bk).forEach(function(k){if(+k>_bmax)_bmax=+k;});
    var bks=[];for(var _b=0;_b<=_bmax;_b+=15)bks.push(_b);
    if(bks.length){
      var mx=0;bks.forEach(function(k){if((bk[k]||0)>mx)mx=bk[k]||0;});
      var _sa=bks.map(function(k){return bk[k]||0;}).sort(function(a,b){return a-b;});
      var _med=_sa.length%2?_sa[(_sa.length-1)/2]:Math.round((_sa[_sa.length/2-1]+_sa[_sa.length/2])/2);
      window.__beatHits=IH;
      h+='<div style="margin-top:10px"><div style="display:flex;gap:3px;align-items:flex-end">';
      bks.forEach(function(k,idx){
        var v=bk[k]||0,last=idx===bks.length-1;
        var cold=!last&&v<=Math.max(1,Math.round(mx*0.25));
        var col=cold?'#F09595':(v>=mx*0.6?'#378ADD':(v>=mx*0.25?'#85B7EB':'#B5D4F4'));
        var tc=(cold||v>=mx*0.6)?'#fff':'#3B3F55';
        h+='<div style="flex:1;min-width:0;text-align:center;'+(IH.length?'cursor:pointer':'')+'" '+(IH.length?'onclick="tgBeat('+k+')"':'')+'>'
          +'<div style="height:26px;background:'+col+';border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:'+tc+'">'+v+'</div>'
          +'<div style="font-size:10px;color:var(--tx3);margin-top:2px">'+k+'′</div></div>';
      });
      h+='</div><div style="font-size:11px;color:var(--tx3);margin-top:4px">色深=引导密 · 红格=冷场档（≤峰值 25%）· 本场中位 '+_med+' 次/15分'+(IH.length?' · 点格子展开该段原话':'')+'</div>';
      bks.forEach(function(k){h+='<div id="beatD'+k+'" style="display:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px"></div>';});

    navigator.clipboard.writeText(t).then(function(){toast('已复制到剪贴板');},function(){fallbackCopy(t);});

  }else fallbackCopy(t);

}

function fallbackCopy(t){

  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';

  document.body.appendChild(ta);ta.select();

  try{document.execCommand('copy');toast('已复制到剪贴板');}catch(e){toast('复制失败，请手动长按选择');}

  document.body.removeChild(ta);

}

function downloadTxt(t,name){

}



/* ============ 分享面板（2026-09-10 师兄：导出 Markdown → 分享，内含 导出 / 转发） ============
   一级「分享」= 导出文件 / 转发；二级「转发」= 微信版 / 系统分享 / Markdown 原文。
   背景：报告全文其实是纯文本（无 ** 无 # 无表格），章节写作「一、xxx」、列表写作「- xxx」，
   所以「微信版」的活儿就是把列表记号与空行收拾干净，粘到微信/群里排版不脏。
   ⚠️ 只做「复制 / 下载 / 调系统分享面板」这些读动作，绝不替用户发出去（写操作一律人工）。 */
var _sharePrev='',_shareStep=1;

/* 报告文本 → 微信友好纯文本 */
function mdToWx(t){
  var ls=String(t||'').split(/\r?\n/),out=[];
  for(var i=0;i<ls.length;i++){
    var ln=ls[i].replace(/[ \t]+$/,'');
    if(!ln.trim()){if(out.length&&out[out.length-1]!=='')out.push('');continue;}
    ln=ln.replace(/^- /,'\u00b7 ').replace(/^\s*#{1,6}\s*/,'').replace(/^\s*>\s?/,'')
         .replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1')
         .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 $2');
    out.push(ln);
  }
  while(out.length&&out[out.length-1]==='')out.pop();
  return out.join('\n');
}

/* ============ 备份 ============ */

function exportJSON(){

  var t=JSON.stringify(DB,null,2);

  var b=new Blob([t],{type:'application/json;charset=utf-8'});

  var u=URL.createObjectURL(b),a=document.createElement('a');

  /* 文件名带时分秒：同一天多次备份不会互相覆盖 */

  var _d=new Date(),_p=function(n){return ('0'+n).slice(-2);};

  var _stamp=today()+'_'+_p(_d.getHours())+_p(_d.getMinutes())+_p(_d.getSeconds());

  a.href=u;a.download='手机经营日报备份_'+_stamp+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);

  setTimeout(function(){URL.revokeObjectURL(u);},1000);

  toast('备份已导出（'+(DB.accounts.length+DB.sessions.length)+' 条）');

}

function importJSON(inp){

  var f=inp.files&&inp.files[0];if(!f)return;

  var r=new FileReader();

  r.onload=function(){

    try{

      var j=JSON.parse(r.result);

      if(!j.accounts||!j.sessions)throw new Error('文件格式不对');

      modal('<h3>导入恢复</h3><div class="sub">文件含 '+j.accounts.length+' 个账号、'+j.sessions.length+' 条场次。选择导入方式：</div>'

       +'<div class="frow"><button class="btn pri lg" onclick="doImport(1)">合并（保留现有数据）</button>'

       +'<button class="btn danger lg" onclick="doImport(0)">覆盖（清空后导入）</button>'

       +'<button class="btn ghost lg" onclick="closeModal()">取消</button></div>');

      window._imp=j;

function doImport(merge){

  var j=window._imp;if(!j)return;

  if(!merge){DB.accounts=[];DB.sessions=[];}

  var idmap={};

  j.accounts.forEach(function(a){

    var ex=DB.accounts.filter(function(x){return x.name===a.name;})[0];

    if(ex){idmap[a.id]=ex.id;for(var k in a){if(k!=='id')ex[k]=a[k];}}

    else{var na=JSON.parse(JSON.stringify(a));if(!na.id)na.id=uid();DB.accounts.push(na);idmap[a.id]=na.id;}

  });

  var n=0;

  j.sessions.forEach(function(s){

    var ns=JSON.parse(JSON.stringify(s));

    ns.acc=idmap[s.acc]||s.acc;

    if(!ns.id)ns.id=uid();

    if(!ns.review)ns.review={done:false,highlight:'',problem:'',next:'',updated:''};

    var dup=DB.sessions.filter(function(x){return x.date===ns.date&&x.acc===ns.acc;})[0];

    if(dup){for(var k in ns){if(k!=='id')dup[k]=ns[k];}}

    else DB.sessions.push(ns);

    n++;

  });

  DB.cfg.seeded=true;

  save();closeModal();render();toast('已导入 '+n+' 条场次数据');

}

/* ============ 云同步（JSONBin.io 免费服务） ============ */

var syncReady=false;      /* 初始 load 期间为 false，syncPush 跳过；pull 完成后置 true */

var syncTimer=null;       /* debounce 定时器 */



function syncPush(){

  /* 不同步时必须把"已排队"的推送一并撤销：
     debounce 回调里不会二次检查条件，光 return 挡不住上一次排队的请求。
     典型场景：刚改完数据（触发推送排队）就清空，若不撤销，几秒后会把空数据推上云。 */

  if(!syncReady||!DB.cloud||!DB.cloud.apiKey||!DB.cloud.binId||DB.cloud.autoSync===false){

    if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}

    return;

  }

  if(syncTimer)clearTimeout(syncTimer);

  syncTimer=setTimeout(function(){

    setSyncDot('sync');

    var snap=JSON.parse(JSON.stringify(DB));

    snap.cloud=null;                 /* 不把云配置本身存进云端 */

    /* 2026-09-09 云同步修复（师兄"恢复云同步"）：JSONBin 免费层 body 上限 ~100KB，
       全量 DB 含 transcripts（189 篇逐字稿 ~3MB）必被拒（超限响应无 CORS 头，表现为 fetch 报 CORS）。
       transcripts/rtKpi/rtBin 等快照类字段本就该各设备从 workbench_data.json 自取，不进云包。 */
    snap.transcripts=null;
    snap.interBase=null;
    snap.rtKpi=null;
    snap.rtBin=null;
    snap.guard=null;
    snap.procheck=null;
    snap.autoRuns=null;
    snap.snapInfo=null;
    snap.sessionsArch=[];   /* 113KB 大头：归档场次快照可由 workbench_data.json 重建，不进云包 */
    (snap.accounts||[]).forEach(function(a){a.rt=null;});

    /* 方案B：精简同步——仅保留最近7天sessions */
    var _d=new Date();_d.setDate(_d.getDate()-6);
    var _m=('0'+(_d.getMonth()+1)).slice(-2),_dd=('0'+_d.getDate()).slice(-2);
    var _start=_d.getFullYear()+'-'+_m+'-'+_dd;
    snap.sessions=(snap.sessions||[]).filter(function(s){return s.date&&s.date>=_start;});
    /* 注：不能因为最近 7 天没场次就跳过推送——账号增删、设置、复盘记录也要上云 */

    fetch('https://api.jsonbin.io/v3/b/'+DB.cloud.binId,{

      method:'PUT',

      headers:{'Content-Type':'application/json','X-Master-Key':DB.cloud.apiKey},

      body:JSON.stringify({d:snap,t:Date.now()})

    }).then(function(r){return r.json();}).then(function(){

      DB.cloud.lastPushTs=Date.now();

      localStorage.setItem(KEY,JSON.stringify(DB));

      setSyncDot('on');

    }).catch(function(){setSyncDot('err');});

  },1500);

}



function syncPull(cb){

  if(!DB.cloud||!DB.cloud.apiKey||!DB.cloud.binId){cb&&cb();return;}

  setSyncDot('sync');

  fetch('https://api.jsonbin.io/v3/b/'+DB.cloud.binId+'/latest',{

    headers:{'X-Master-Key':DB.cloud.apiKey}

  }).then(function(r){return r.json();}).then(function(res){

    if(res&&res.record&&res.record.d){

      var cloudData=res.record.d;

      var cloudTs=res.record.t||0;

      if(cloudTs>(DB.localTs||0)){

        var keepCloud=DB.cloud;

        /* 2026-09-09：云端包不含快照类字段（transcripts/rtKpi 等已在 push 端剥离），
           替换时保留本地的，否则手机端逐字稿/实时状态会被清空 */
        var _keep={};
        var _kk=['transcripts','interBase','rtKpi','rtBin','guard','procheck','autoRuns','snapInfo','sessionsArch'];
        _kk.forEach(function(k){if(DB[k]!=null)_keep[k]=DB[k];});
        (DB.accounts||[]).forEach(function(a,i){if(a.rt)_keep['rt'+i]=a.rt;});

        DB=cloudData;

        _kk.forEach(function(k){if(_keep[k]!=null)DB[k]=_keep[k];});
        (DB.accounts||[]).forEach(function(a,i){if(_keep['rt'+i])a.rt=_keep['rt'+i];});

        DB.cloud=keepCloud;

        DB.localTs=cloudTs;

        localStorage.setItem(KEY,JSON.stringify(DB));

        toast('已从云端同步最新数据');

      }

    }

    setSyncDot('on');

    cb&&cb();

  }).catch(function(){setSyncDot('err');cb&&cb();});

}



function syncCreateBin(cb){

  if(!DB.cloud||!DB.cloud.apiKey){cb&&cb(false);return;}

  var snap=JSON.parse(JSON.stringify(DB));

  snap.cloud=null;

  /* 同 syncPush：剥离超限大字段与快照类字段（JSONBin 免费层 body 上限） */
  snap.transcripts=null;
  snap.interBase=null;
  snap.rtKpi=null;
  snap.rtBin=null;
  snap.guard=null;
  snap.procheck=null;
  snap.autoRuns=null;
  snap.snapInfo=null;
  snap.sessionsArch=[];
  (snap.accounts||[]).forEach(function(a){a.rt=null;});
  var _d=new Date();_d.setDate(_d.getDate()-6);
  var _m=('0'+(_d.getMonth()+1)).slice(-2),_dd=('0'+_d.getDate()).slice(-2);
  var _start=_d.getFullYear()+'-'+_m+'-'+_dd;
  snap.sessions=(snap.sessions||[]).filter(function(s){return s.date&&s.date>=_start;});
  if(!snap.sessions.length)return;

  fetch('https://api.jsonbin.io/v3/b',{

    method:'POST',

    headers:{'Content-Type':'application/json','X-Master-Key':DB.cloud.apiKey,'X-Bin-Private':'true','X-Bin-Name':'live-console-sync'},

    body:JSON.stringify({d:snap,t:Date.now()})

  }).then(function(r){return r.json();}).then(function(res){

    if(res&&res.metadata&&res.metadata.id){

      DB.cloud.binId=res.metadata.id;

      localStorage.setItem(KEY,JSON.stringify(DB));

      cb&&cb(true);

    }else{cb&&cb(false);}

  }).catch(function(){cb&&cb(false);});

}

/* ============ 账号增删（用户覆盖层：跨快照刷新保留） ============ */
/* 每次拉到更新的 workbench_data.json 都会整体重建 accounts，
   所以新增/删除必须记在覆盖层，由 applySnapshot 每次重新套用；
   否则明天数据一更新，师兄在手机上做的改动就全丢了。 */

function applyUserOverrides(accs,accsArch,m){
  if(!DB.accDel)DB.accDel=[];
  if(!DB.accAdd)DB.accAdd=[];
  if(!m)m={};
  /* 0) 用现有在播账号把映射补满：
        单独新增账号时外面传的是空映射，不补会把已有账号再追加一份 */
  accs.forEach(function(a){
    if(!m[normK(a.name)])m[normK(a.name)]=a.id;
    if(a.sheet&&!m[normK(a.sheet)])m[normK(a.sheet)]=a.id;
  });
  /* 1) 手动删除的：移出在播，并入已归档（历史场次保留，可恢复） */
  for(var i=accs.length-1;i>=0;i--){
    var a=accs[i];
    if(DB.accDel.indexOf(normK(a.name))>=0||(a.sheet&&DB.accDel.indexOf(normK(a.sheet))>=0)||DB.accDel.indexOf(a.id)>=0){
      a.status='terminated';
      a.archivedDate=a.archivedDate||today();
      a.archiveNote=a.archiveNote||'手机端手动删除（终止合作）· 历史场次保留';
      accsArch.push(a);
      accs.splice(i,1);
    }
  }
  /* 2) 手动新增的：追加到在播（快照里已有同名的跳过，防重复） */
  DB.accAdd.forEach(function(a){
    if(m[normK(a.name)])return;
    var id=uid(); m[normK(a.name)]=id;
    accs.push({id:id,name:a.name,sheet:a.sheet||a.name,operator:a.operator||'点淘',plat:a.plat||'抖音',
      auth:'ok',lastGuard:today(),liveTime:a.liveTime||'',guard:a.guard||'',auto:a.auto||'',
      week:(a.week&&a.week.length)?a.week:[1,2,3,4,5,6,7],cat:a.cat||'',note:a.note||'',
      status:'active',archivedDate:'',lastLiveDate:'',archiveNote:'',custom:true});
  });
  /* 3) 手动编辑过的字段：重新套到重建出来的账号上（改开播时间/星期/备注等靠这个留存） */
  (DB.accPatch||[]).forEach(function(p){
    var hit=null;
    for(var i=0;i<accs.length;i++){
      var x=accs[i];
      if(normK(x.name)===normK(p.name)){hit=x;break;}
      if(p.sheet&&x.sheet&&normK(x.sheet)===normK(p.sheet)){hit=x;break;}
    }
    if(!hit)return;
    ACC_FIELDS.forEach(function(f){
      if(p[f]!==undefined&&p[f]!==''&&!(Array.isArray(p[f])&&!p[f].length))hit[f]=p[f];
    });
  });
}

function doAddAccount(){

  var dup=false;
  DB.accounts.forEach(function(a){if(normK(a.name)===normK(n))dup=true;});

function askDelAccount(id){
  var a=null;
  for(var i=0;i<DB.accounts.length;i++){if(DB.accounts[i].id===id){a=DB.accounts[i];break;}}
  if(!a){toast('账号不存在');return;}
  var n=0;
  for(var j=0;j<DB.sessions.length;j++){if(DB.sessions[j].acc===id)n++;}
  _delId=id;
  modal('<h3>归档账号</h3>'
   +'<div class="sub">确定删除「'+esc(a.name)+'」？</div>'
   +'<div class="sync-warn">归档后会移到「已归档」页并标记为<b>已解除合作</b>，'
   +(n?('其 '+n+' 场历史数据保留可查，'):'该账号暂无历史数据，')

   +'<div style="display:flex;gap:8px;justify-content:flex-end">'

function delAccount(){
  var id=_delId,idx=-1;
  for(var i=0;i<DB.accounts.length;i++){if(DB.accounts[i].id===id){idx=i;break;}}
  if(idx<0){toast('账号不存在');closeModal();return;}
  var a=DB.accounts[idx];
  if(!DB.accDel)DB.accDel=[];
  /* 自己新增的账号没有历史，直接从新增列表抹掉，不留归档垃圾 */
  if(a.custom){
    DB.accAdd=DB.accAdd.filter(function(x){return normK(x.name)!==normK(a.name);});
    DB.accounts.splice(idx,1);
    save();closeModal();render();toast('已删除自定义账号：'+a.name);
    return;
  }
  /* 快照账号：记进删除覆盖层 + 移入已归档，历史场次一并搬过去 */
  if(DB.accDel.indexOf(normK(a.name))<0)DB.accDel.push(normK(a.name));
  a.status='terminated';
  a.archivedDate=a.archivedDate||today();
  a.archiveNote=a.archiveNote||'手机端手动删除（终止合作）· 历史场次保留';
  DB.accounts.splice(idx,1);
  DB.accountsArch.push(a);
  for(var j=DB.sessions.length-1;j>=0;j--){
    if(DB.sessions[j].acc===id){DB.sessionsArch.push(DB.sessions[j]);DB.sessions.splice(j,1);}
  }
  save();closeModal();render();toast('已归档「'+a.name+'」，历史保留在已归档');
}

function restoreAccount(id){
  var idx=-1;
  for(var i=0;i<DB.accountsArch.length;i++){if(DB.accountsArch[i].id===id){idx=i;break;}}
  if(idx<0){toast('账号不存在');return;}
  var a=DB.accountsArch[idx];
  /* 只放行"手动删除"的；由守护矩阵归档的必须改矩阵，避免和自动化打架 */
  if(!/手动删除/.test(a.archiveNote||'')){
    toast('该账号由守护矩阵归档，请改矩阵后重跑同步脚本');
    return;
  }
  if(DB.accDel)DB.accDel=DB.accDel.filter(function(k){return k!==normK(a.name)&&k!==normK(a.sheet||'')&&k!==a.id;});
  a.status='active';a.archivedDate='';a.archiveNote='';
  DB.accountsArch.splice(idx,1);
  DB.accounts.push(a);
  for(var j=DB.sessionsArch.length-1;j>=0;j--){
    if(DB.sessionsArch[j].acc===id){DB.sessions.push(DB.sessionsArch[j]);DB.sessionsArch.splice(j,1);}
  }
  save();render();toast('已恢复「'+a.name+'」到在播');
}

/* ============ 真实数据快照（workbench_data.json，由主表自动导出） ============ */

function applySnapshot(snap){
  var m={},accs=[],accsArch=[];
  /* —— P0-B 本地手写保留层（2026-09-08）——
     主表导出的快照不含 review 三栏/note/video/audio/doc（这些是手机端本地维护的），
     而 applySnapshot 会把 sessions 整体重建，旧代码在 rec 里把这几项硬编码成空，
     导致每次刷新快照本地手写的复盘/备注/素材链接全被吞掉。
     这里在重建前先按「账号稳定身份|日期|开播时间」索引本地手写字段，
     重建时命中同一场就回填，未命中的场次才用快照默认值。
     稳定身份用账号 sheet（改名不动 sheet → id 复用），无 sheet 的自定义账号退 acc id。 */
  var localNotes={};
  var oldId2Sheet={};
  (DB.accounts||[]).concat(DB.accountsArch||[]).forEach(function(a){
    oldId2Sheet[a.id]=(a.sheet?a.sheet:(a.name||a.id));
  });
  var idxOld=function(s){
    var sheet=oldId2Sheet[s.acc]||s.acc;
    return normK(sheet)+'|'+(s.date||'')+'|'+(s.liveTime||'');
  };
  (DB.sessions||[]).concat(DB.sessionsArch||[]).forEach(function(s){
    var k=idxOld(s);
    if(!localNotes[k])localNotes[k]=null;
    if(s.review&&(s.review.highlight||s.review.problem||s.review.next||s.review.done))
      localNotes[k]={review:s.review,note:s.note||'',video:s.video||'',audio:s.audio||'',doc:s.doc||''};
    else if(s.note||s.video||s.audio||s.doc)
      localNotes[k]={review:s.review||null,note:s.note||'',video:s.video||'',audio:s.audio||'',doc:s.doc||''};
  });
  /* 用已有账号的 sheet 做稳定身份：重建快照时复用相同 sheet 账号的 id，
     避免手机端本地改名/自定义账号与快照账号分裂，导致场次挂错账号。 */
  var existingBySheet={};
  (DB.accounts||[]).concat(DB.accountsArch||[]).forEach(function(a){
    if(a.sheet)existingBySheet[normK(a.sheet)]=a.id;
  });
  snap.accounts.forEach(function(r){
    var id=existingBySheet[normK(r.sheet)]||uid();
    m[normK(r.name)]=id;m[normK(r.sheet)]=id;
    var rec={id:id,name:r.name,sheet:r.sheet,operator:r.operator||'点淘',plat:'抖音',
      auth:'ok',lastGuard:r.lastGuard||today(),liveTime:r.liveTime||'',guard:r.guard||'',auto:r.auto||'',
      week:[1,2,3,4,5,6,7],note:'',
      status:r.status||'active',archivedDate:r.archivedDate||'',lastLiveDate:r.lastLiveDate||'',archiveNote:r.archiveNote||'',
      /* 实时工作台真状态（2026-09-08）：数据桥从 127.0.0.1:8765 并入，含 phase / 真实开播下播时刻。
         有它 liveStatus 就读真值，不再用 4 小时窗口猜「直播中/断播」。 */
      rt:r.rt||null};
    if(rec.status==='dormant'||rec.status==='terminated') accsArch.push(rec); else accs.push(rec);
  });
  /* 清理与快照账号重复的自定义账号，避免旧本地覆盖层留下「上午/下午」等影子账号 */
  var snapSheets={};var snapBases={};
  accs.concat(accsArch).forEach(function(a){
    if(a.sheet)snapSheets[normK(a.sheet)]=true;
    snapBases[baseName(a.name)]=true;
  });
  /* 根治：顺手把 accAdd（手机本地自定义账号覆盖层）里与快照账号重复的也清掉。
     否则云端把旧 accAdd 同步回手机后，影子账号会在 applyUserOverrides 里重新加回 accs 而复活
     （师兄 09-04 实测「丹丹老师古法健身（上午）」刷新后仍出现，根因就是云端旧 accAdd 残留）。
     只删「与快照账号同 sheet/同基础名」的重复项，独立自定义账号不动。 */
  if(DB.accAdd&&DB.accAdd.length){
    DB.accAdd=DB.accAdd.filter(function(x){
      if(x.sheet&&snapSheets[normK(x.sheet)])return false;
      if(snapBases[baseName(x.name)])return false;
      return true;
    });
  }
  var dedupCustom=function(list){
    var seen={},out=[];
    list.forEach(function(a){
      if(a.custom){
        if(a.sheet&&snapSheets[normK(a.sheet)])return;
        if(snapBases[baseName(a.name)])return;
      }
      var k=(a.sheet?normK(a.sheet):'')+'|'+normK(a.name);
      if(seen[k])return;
      seen[k]=true;out.push(a);
    });
    return out;
  };
  accs=dedupCustom(accs);accsArch=dedupCustom(accsArch);
  applyUserOverrides(accs,accsArch,m);
  /* accPatch / accAdd 可能又补进重复自定义账号，再清一次 */
  accs=dedupCustom(accs);accsArch=dedupCustom(accsArch);
  var sess=[],sessArch=[];
  /* 新账号身份 id→稳定 sheet，供重建时给场次算回填 key（与 localNotes 同口径） */
  var newAccById={};
  accs.concat(accsArch).forEach(function(a){newAccById[a.id]=(a.sheet?a.sheet:(a.name||a.id));});
  snap.sessions.forEach(function(r){
    var aid=m[normK(r.acc)]||(accs[0]?accs[0].id:'');
    var rec={id:uid(),date:r.date,acc:aid,weekday:r.weekday||'',
      liveTime:r.liveTime||'',dur:r.dur||'',
      peak:r.peak||0,enter:r.enter||0,expose:r.expose||0,views:r.views||0,
      avgOnline:r.avgOnline||0,avgView:r.avgView||'',fans:r.fans||0,teamAdd:r.teamAdd||0,
      expViewRate:r.expViewRate||'',viewFanRate:r.viewFanRate||'',viewInterRate:r.viewInterRate||'',
      gmv:r.gmv||0,orders:r.orders||0,buyers:r.buyers||0,conv:r.conv||'',thousandGmv:r.thousandGmv||'',
      fanRatio:r.fanRatio||'',product:r.product||'',
      flowRec:r.flowRec||'',flowFollow:r.flowFollow||'',flowHome:r.flowHome||'',flowSearch:r.flowSearch||'',
      flowShort:r.flowShort||'',flowToutiao:r.flowToutiao||'',flowPaid:r.flowPaid||'',flowMall:r.flowMall||'',
      trail:r.trail||0,bagRounds:r.bagRounds||0,bagUsers:r.bagUsers||0,
      /* 场次溯源 room_id：串场次↔转写稿↔录制↔截图的钥匙，主表填充率约 41% */
      room:r.room||'',
      /* 本场转写稿在 DB.transcripts 里的下标；0 是合法下标，所以判 null 不能判真假 */
      tr:(r.tr==null?null:r.tr),
      video:'',audio:'',doc:'',note:'',
      review:{done:!!r.reviewDone,highlight:'',problem:'',next:'',updated:r.reviewDone?r.date:''}};
    /* P0-B 回填：命中本地手写索引则覆盖 video/audio/doc/note + review 三栏，
       保住手机端本地维护内容不被快照重建吞掉；只读场次指标仍以快照为准。 */
    var lk=normK(newAccById[aid]||aid)+'|'+(r.date||'')+'|'+(r.liveTime||'');
    var ln=localNotes[lk];
    if(ln){
      if(ln.video)rec.video=ln.video;
      if(ln.audio)rec.audio=ln.audio;
      if(ln.doc)rec.doc=ln.doc;
      if(ln.note)rec.note=ln.note;
      if(ln.review&&(ln.review.highlight||ln.review.problem||ln.review.next||ln.review.done))
        rec.review=ln.review;
    }
    var isArch=false; for(var i=0;i<accsArch.length;i++){if(accsArch[i].id===aid){isArch=true;break;}}
    if(isArch) sessArch.push(rec); else sess.push(rec);
  });
  DB.accounts=accs;DB.sessions=sess;DB.accountsArch=accsArch;DB.sessionsArch=sessArch;
  DB.cfg.seeded=true;DB.cfg.gmvSeed=true;DB.cfg.opReset=true;
  DB.snapInfo={exportedAt:snap.exportedAt||'',dataDate:snap.dataDate||'',source:snap.sourceNote||''};
  /* 体系可观测三件套（2026-09-03）：守护健康度 / 进程自检 / 自动化业务级结果 */
  DB.guard=snap.guardHealth||null;
  DB.procheck=snap.procheck||null;
  DB.autoRuns=snap.autoRuns||null;
  /* 实时工作台真状态汇总（2026-09-08）：live_now / cdp_alive / guard_alive / gen_at */
  DB.rtKpi=snap.rtKpi||null;
  /* 轻量实时通道标记：手机端据此去 JSONBin 公共 bin 拉真状态（免 Key、零 deploy、零积分） */
  DB.rtBin=snap.rtBin||null;
  /* 主播话术文字稿（录屏转写产物，按场次挂载）2026-09-03 */
  DB.transcripts=snap.transcripts||null;
  /* 互动密度基准（2026-09-09 节拍热力带）：每账号历史中位 次/10分钟 —— 顶层字段必须显式挂 */
  DB.interBase=snap.interBase||{};
}

function loadSnapshot(cb){
  fetch('workbench_data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(snap){
    if(snap&&snap.version===3&&snap.accounts&&snap.sessions&&(!DB.cfg.dataSnapTs||DB.cfg.dataSnapTs<snap.exportedAt)){
      applySnapshot(snap);
      DB.cfg.dataSnapTs=snap.exportedAt;
      save();
      cb&&cb(true);
    }else{
      cb&&cb(false);
    }
  }).catch(function(){cb&&cb(false);});
}

/* 一键配置云同步：打开形如 ...?bin=<BinID>&key=<MasterKey>&auto=1 的链接即可自动配好，
   省得在手机上手工粘贴那一长串 Key。
   配完立刻用 history.replaceState 把参数从地址栏抹掉，
   免得 Key 留在浏览器历史/分享出去的链接里。 */
function applyCloudFromURL(){
  try{
    var q=new URLSearchParams(location.search);
    var id=(q.get('bin')||'').trim(),key=(q.get('key')||'').trim();
    if(!id||!key)return false;
    DB.cloud={apiKey:key,binId:id,autoSync:q.get('auto')!=='0'};
    save();
    history.replaceState(null,'',location.pathname);
    return true;
  }catch(e){return false;}
}

loadSnapshot(function(){
  if(DB.cloud&&DB.cloud.apiKey&&DB.cloud.binId){
    syncPull(function(){syncReady=true;render();updateSyncBtn();
      if(_cloudFromURL)toast('云同步已配置成功 · 正在拉取云端数据');});
  }else{
    syncReady=true;
    /* 配了实时通道：先拉到真状态再首渲，消除"推断值→真值"刷新闪跳；3s 兜底防留白 */
    if(DB.rtBin&&DB.rtBin.binId){
      window.__prefetchRt&&window.__prefetchRt();
      setTimeout(render,3000);
    }else{
      render();
    }
  }
});

/* 页面可见时每 60 秒静默拉取一次云端最新 */

setInterval(function(){
  if(document.visibilityState==='visible'&&syncReady){
    if(document.getElementById('modalHost').innerHTML.trim())return;
    loadSnapshot(function(updated){
      if(DB.cloud&&DB.cloud.apiKey&&DB.cloud.binId){
        syncPull(function(){render();});
      }else if(updated){
        render();
      }
    });
  }
},60000);

/* 2026-09-08：轻量实时状态轮询（实时通道）
   云端 workbench_data.json 是静态快照，不重新 deploy 到不了手机。所以真·实时走
   JSONBin 常驻公共 bin：sync_rt.py 服务端推、前端免 Key 直拉，零 deploy、零 LLM、
   零 WorkBuddy 积分。无 rtBin 时回退轮询 rt_status.json（需经桥 deploy 才新鲜）。

   要点：① 标签页不可见时不拉（省手机流量/电量）；② JSONBin 公共 bin 免 Key 直读；
   ③ 内容与上次相同则不重渲染（省资源）；④ 只改内存中的 rt 切片，不触发 save/syncPush。 */
(function startRtLive(){
  function applyRtPatch(rec){
    if(!rec||!rec.accounts)return false;
    var byName={};
    rec.accounts.forEach(function(p){byName[String(p.name)]=p.rt;});
    DB.accounts.forEach(function(a){var rt=byName[String(a.name)];if(rt!==undefined)a.rt=rt;});
    if(rec.rtKpi)DB.rtKpi=rec.rtKpi;
    return true;
  }
  var _rtDone=false;
  function tick(){
    if(document.visibilityState!=='visible')return;   /* 后台不拉 */
    var src=(DB.rtBin&&DB.rtBin.binId)
      ? 'https://api.jsonbin.io/v3/b/'+DB.rtBin.binId+'/latest'   /* 公共 bin，免 Key */
      : 'rt_status.json';                                       /* 兜底：部署目录 sidecar */
    fetch(src,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(res){
      var rec=res&&res.record?res.record:res;   /* JSONBin 包在 {record:...}，sidecar 是裸 JSON */
      if(!rec||!rec.accounts)return;
      var sig=JSON.stringify(rec);
      if(sig===window.__rtSig)return;           /* 没变不重渲染 */
      window.__rtSig=sig;
      if(applyRtPatch(rec)){
        render();                                /* 拉到真状态即首渲（消除刷新闪跳） */
        _rtDone=true;
      }
    }).catch(function(){});
  }
  window.__prefetchRt=function(){ if(!_rtDone)tick(); };  /* 首渲前由 loadSnapshot 在快照就位后调用 */
  setInterval(tick,300000);     /* 前端轮询 5 分钟：落回 JSONBin 免费额度内（1万次/月≈333/天），状态栏够用 */
})();

</script>
