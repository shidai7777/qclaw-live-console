<!DOCTYPE html>

<html lang="zh-CN" data-page-node-id="KVCrCHIbVYVURvDbUmjeay">

<title>直播运营管理台</title>

<style>

:root{

  --pri:#4F46E5; --pri-soft:#EEF0FF; --pri-dark:#3730A3;

  --bg:#F6F7FB; --card:#FFFFFF; --line:#E6E8F0;

  --tx:#1B1D29; --tx2:#5B6079; --tx3:#8A90A8;

  --red:#DC2626; --red-soft:#FEF0F0;

  --green:#16A34A; --green-soft:#EDF9F0;

  --amber:#D97706; --amber-soft:#FFF7E8;

  --r:14px; --sh:0 1px 2px rgba(20,24,60,.05),0 6px 20px rgba(20,24,60,.05);

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{margin:0;padding:0}

body{

  background:var(--bg);color:var(--tx);

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;

  font-size:15px;line-height:1.55;

  padding-bottom:calc(76px + env(safe-area-inset-bottom));

}

h1,h2,h3,h4,p{margin:0}

button{font-family:inherit;font-size:15px;cursor:pointer;border:0;background:none;color:inherit}

input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}

svg{display:block}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

.hide{display:none !important}



/* ---------- header ---------- */

header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}

.hd{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}

.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4F46E5,#7C6BF0);display:flex;align-items:center;justify-content:center;flex:0 0 auto}

.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.hd-t{flex:1 1 auto;min-width:120px}

.hd-t h1{font-size:17px;font-weight:700;letter-spacing:.2px}

.hd-t span{font-size:12px;color:var(--tx3)}

.hd-a{display:flex;gap:8px;flex-wrap:wrap}



.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 13px;border-radius:10px;background:var(--pri-soft);color:var(--pri-dark);font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}

.btn:hover{filter:brightness(.97)}

.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn.pri{background:var(--pri);color:#fff}

.btn.ghost{background:#F1F2F7;color:var(--tx2)}

.btn.danger{background:var(--red-soft);color:var(--red)}

.btn.lg{min-height:46px;padding:0 18px;font-size:15px}

.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}

@media(max-width:768px){.btn,.btn.sm{min-height:44px;padding:0 14px}}



/* ---------- tabs ---------- */

nav.tabs{display:flex;gap:4px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

nav.tabs::-webkit-scrollbar{display:none}

nav.tabs button{display:flex;align-items:center;gap:7px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--tx3);border-bottom:2px solid transparent;white-space:nowrap}

nav.tabs button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}



/* ---------- bottom nav (mobile) ---------- */

.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

.bnav div{display:flex}

.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:11px;font-weight:600;color:var(--tx3);min-height:56px}

.bnav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.bnav button.on{color:var(--pri)}

@media(max-width:768px){.bnav{display:block} nav.tabs{display:none}}



/* ---------- cards ---------- */

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}

.card-h{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}

.card-h h2{font-size:15px;font-weight:700;flex:1 1 auto}

.card-h .ic{width:26px;height:26px;border-radius:8px;background:var(--pri-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}

.card-h .ic svg{width:14px;height:14px;stroke:var(--pri);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

.sec{padding-top:14px}



/* ---------- banner ---------- */

.tipbar{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid #FBE3B8;color:#8A5A08;border-radius:12px;padding:10px 13px;margin:12px 0 0;font-size:13.5px}

.tipbar svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}



/* ---------- 数据新鲜度 ---------- */

.freshbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx3);padding:8px 0 0;line-height:1.45}

.freshbar svg{width:14px;height:14px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.freshbar .fb-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--green)}

.freshbar .fb-t{flex:1;min-width:0}

.freshbar.warn{background:var(--amber-soft);border:1px solid #FBE3B8;color:#8A5A08;border-radius:10px;padding:7px 11px;margin:8px 0 0}

.freshbar.bad{background:var(--red-soft);border:1px solid #F8D3D3;color:#A02020;border-radius:10px;padding:7px 11px;margin:8px 0 0}



/* ---------- today ---------- */

.today{background:linear-gradient(160deg,#FFFFFF,#FBFBFF);border:1px solid var(--line);border-left:4px solid var(--pri)}

.todo{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:11px;background:#FAFAFD;border:1px solid var(--line);margin-bottom:8px}

.todo:last-child{margin-bottom:0}

.todo .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 auto;background:var(--pri)}

.todo.over{background:var(--red-soft);border-color:#F8D4D4}

.todo.over .dot{background:var(--red)}

.todo.over .tt{color:var(--red);font-weight:600}

.todo.warn{background:var(--amber-soft);border-color:#FBE3B8}

.todo.warn .dot{background:var(--amber)}

.todo .tc{flex:1 1 auto;min-width:0}

.todo .tt{font-size:14px}

.todo .ts{font-size:12px;color:var(--tx3);margin-top:2px}

/* ---------- live panel ---------- */

.live-panel{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}

.live-head{display:grid;grid-template-columns:1fr 56px 72px 62px 62px 84px;gap:4px;padding:7px 12px;background:#F6F7FB;font-size:10.5px;font-weight:600;color:var(--tx3);text-align:center;align-items:center}

.live-head>div:first-child{text-align:left}

.live-row{display:grid;grid-template-columns:1fr 56px 72px 62px 62px 84px;gap:4px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;align-items:center;text-align:center}

.live-row>div:first-child{text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.live-row.skipped{opacity:.5}

.live-act{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:nowrap}

.sync-ok{color:var(--green);font-weight:600;font-size:11.5px}

.sync-wait{color:var(--amber);font-weight:600;font-size:11.5px}

.sync-na{color:var(--tx3);font-size:11.5px}

.st-pending{background:#F1F2F7;color:var(--tx2)}

.st-live{background:#EEF0FF;color:var(--pri)}

.st-offline{background:var(--green-soft);color:var(--green)}

.st-done{background:var(--green-soft);color:var(--green)}

.st-skip{background:#F1F2F7;color:var(--tx3);text-decoration:line-through}

.st-lost{background:var(--red-soft);color:var(--red);font-weight:700}

.sync-note{font-size:11.5px;color:var(--tx3);margin-top:6px;padding:8px 12px;background:#F6F7FB;border-radius:8px}

@media(max-width:768px){

  .hd{padding:8px 0;gap:8px;flex-wrap:nowrap}
  .logo{width:30px;height:30px;border-radius:9px}
  .logo svg{width:18px;height:18px}
  .hd-t{min-width:0;flex:1 1 auto}
  .hd-t h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hdSub{display:none}
  .hd-a{flex:0 0 auto;flex-wrap:nowrap;gap:6px}
  .hd-a .btn{min-height:38px;padding:0 9px}
  .hd-a .btn svg{margin:0}
  .hd-a .btn-t{display:none}

  .live-head{display:none}

  .live-row{grid-template-columns:1fr 1fr;gap:6px;text-align:left;padding:12px}

  .live-row>div{text-align:left}

  .live-row>div:first-child{grid-column:1/-1}

}

.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--red);color:#fff;margin-left:6px;vertical-align:1px}

.empty{text-align:center;padding:22px 10px;color:var(--tx3);font-size:13.5px}

.empty svg{width:34px;height:34px;stroke:#C9CDDE;fill:none;stroke-width:1.6;margin:0 auto 8px}



/* ---------- filter bar ---------- */

.fbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.fbar .f{min-width:130px}

.fbar .f label{font-size:11px;color:#4F46E5;font-weight:700;margin-bottom:3px;display:block;letter-spacing:.2px}

.fbar .f select,.fbar .f input{width:100%;min-height:38px;padding:7px 10px;border:1.5px solid #C7D2FE;border-radius:9px;background:#F5F3FF;outline:none;font-size:13px;color:#4F46E5;font-weight:600}

.fbar .f select:focus,.fbar .f input:focus{border-color:#4F46E5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.15);color:#312E81}

.fbar .f input[type="date"]{font-size:13px;color:#4F46E5}

.fbar .fgroup{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#EEF2FF;border:1.5px dashed #A5B4FC;border-radius:10px;padding:8px 10px 4px;position:relative}

.fbar .fgroup::before{content:''}

.fbar .fgroup .f{min-width:140px}

.fbar .qbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:#F8F8FC;border:1px dashed var(--line);border-radius:10px;position:relative}

.fbar .qbtns::before{content:''}

.fbar .qbtn{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#FCFCFE;color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}

.fbar .qbtn:hover{background:var(--pri-soft);color:var(--pri-dark);border-color:var(--pri-soft)}

.fbar .qbtn.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.fbar .qbtn.rst{background:transparent;color:var(--tx3);border-color:var(--line)}

.fbar .sep{width:1px;height:30px;background:var(--line);margin:0 2px}

.fbar .fcnt{font-size:12px;color:var(--tx3);margin-left:auto;align-self:center}

@media(max-width:768px){.fbar .fcnt{margin-left:0;width:100%;text-align:right}}

@media(max-width:768px){.fbar .f select,.fbar .f input{font-size:16px;min-height:44px}}



/* ---------- 守护总览 ---------- */

.ovw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.ovw .ob{flex:1;min-width:140px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.15s;background:#FCFCFE;text-align:left}

.ovw .ob:hover{border-color:var(--pri-soft);background:var(--pri-soft)}

.ovw .ob.on{border-color:var(--pri);background:var(--pri-soft)}

.ovw .ob .ol{font-size:11px;color:var(--tx3);font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}

.ovw .ob .ol .ci{width:8px;height:8px;border-radius:50%}

.ovw .ob .on{font-size:20px;font-weight:800;color:var(--tx1);margin-top:0}

.ovw .ob .on span{font-size:12px;font-weight:500;color:var(--tx3)}

/* 2026-09-10 17:4x：数字置顶，标签行（左）+ 状态/说明（右）紧贴其下 */
.ovw .ob .on+.ol{margin-top:3px}

.ovw .ob .os{font-size:11px;color:var(--tx3);margin-left:auto;font-weight:500;text-align:right;white-space:normal;overflow-wrap:anywhere;flex:0 1 auto;min-width:0}

.ovw .ob .ol>.kl{flex:0 0 auto;white-space:nowrap}
.ovw .ob .ol .ci{flex:0 0 auto}

.ovw .ob .os .wn{color:#DC2626;font-weight:700}



/* ---------- 守护热力图 ---------- */

.heat{display:flex;gap:4px;margin-top:8px}

.heat .hc{width:28px;height:18px;border-radius:4px;background:#EEEFF4}

.heat .hc.ok{background:#86EFAC}

.heat .hc.skip{background:#FCD34D}

.heat .hc.brk{background:#FCA5A5}

.heat .hc.np{background:#F4F5FA}

.heat .hc.td{outline:2px solid var(--pri);outline-offset:1px}

.heat-legend{display:flex;gap:10px;font-size:10px;color:var(--tx3);margin-top:4px;flex-wrap:wrap}

.heat-legend span{display:flex;align-items:center;gap:3px}

.heat-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.ge{font-size:11px;padding:3px 8px;border-radius:6px;display:flex;align-items:center;gap:4px;flex:none}

.ge.skip{background:#FEF3C7;color:#92400E}

.ge.brk{background:#FEF2F2;color:#DC2626}

.sort-bar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.sort-bar .sl{font-size:12px;color:var(--tx3)}

.sort-bar .sb{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#FCFCFE;color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}

.sort-bar .sb:hover{border-color:var(--pri-soft);color:var(--pri-dark)}

.sort-bar .sb.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.sort-bar .batch{margin-left:auto;min-height:32px;padding:0 12px;border:none;border-radius:7px;background:var(--pri-soft);color:var(--pri-dark);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}

.sort-bar .batch:hover{background:var(--pri);color:#fff}



/* ---------- kpi ---------- */

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}

.kpi .l{font-size:12px;color:var(--tx3);display:flex;align-items:baseline;gap:6px;min-width:0}

.kpi .v{font-size:23px;font-weight:800;margin-top:0;letter-spacing:-.5px}

.kpi .d{font-size:11.5px;color:var(--tx3);margin-left:auto;font-weight:500;text-align:right;white-space:normal;overflow-wrap:anywhere;flex:0 1 auto;min-width:0}

/* 标签永不换行、永不被压缩（说明让位） */
.kpi .kl{flex:0 0 auto;white-space:nowrap}

.kpi .l:last-child{margin-top:4px}

.up{color:var(--red);font-weight:700}

.down{color:var(--green);font-weight:700}

@media(max-width:768px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .v{font-size:20px} .kpi .l{font-size:11.5px;gap:5px} .kpi .d{font-size:10.5px}}

/* 2026-09-08：状态数据卡（今日概览顶部 5 张 · 彩色左条 + 大数字 + 描述 + 底色横线） */
.stat-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:0 0 14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:11px;padding:11px 13px;position:relative;overflow:hidden;box-shadow:var(--sh);min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.stat-card .sc-l{font-size:12px;color:var(--tx3);font-weight:500}
.stat-card .sc-v{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:3px}
.stat-card .sc-d{font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.3}
.stat-card .sc-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pri)}
.stat-card.sc-blue{border-left-color:#3B82F6}.stat-card.sc-blue .sc-bar{background:#3B82F6}
.stat-card.sc-purple{border-left-color:var(--pri)}.stat-card.sc-purple .sc-bar{background:var(--pri)}
.stat-card.sc-green{border-left-color:var(--green)}.stat-card.sc-green .sc-bar{background:var(--green)}
.stat-card.sc-amber{border-left-color:#D97706}.stat-card.sc-amber .sc-bar{background:#D97706}
.stat-card.sc-red{border-left-color:var(--red)}.stat-card.sc-red .sc-bar{background:var(--red)}
.stat-card.sc-grey{border-left-color:#94A3B8}.stat-card.sc-grey .sc-bar{background:#94A3B8}
@media(max-width:768px){.stat-cards{grid-template-columns:repeat(2,1fr)}}
/* 实时状态同步提示（2026-09-08 B 方案）：rt 在不在决定上面几张卡可不可信 */
.rt-tip{display:flex;align-items:center;gap:6px;font-size:11.5px;margin:0 0 9px;padding:5px 10px;border-radius:8px;font-weight:500}
.rt-tip i{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.rt-tip.ok{color:var(--green);background:#F0FDF4}
.rt-tip.ok i{background:var(--green)}
.rt-tip.warn{color:#D97706;background:#FFFBEB}
.rt-tip.warn i{background:#D97706}

/* 2026-09-10：管理条（顶部常驻细条）——图标 + 数字，一屏看全局。数据源全部来自 workbench_data.json */
.mgmtbar{display:flex;align-items:center;gap:6px;padding:8px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mgmtbar::-webkit-scrollbar{display:none}
.mgmtbar .mg-h{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.4px;padding-right:3px;white-space:nowrap}
.mgmtbar .mg-live{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;animation:mgpulse 2s infinite}
@keyframes mgpulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.mg-item{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px;line-height:1;white-space:nowrap}
.mg-item svg{width:12px;height:12px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.mg-item .mg-k{color:var(--tx3);font-weight:500}
.mg-item .mg-v{font-weight:800;font-variant-numeric:tabular-nums}
.mg-item.ok{background:var(--green-soft);border-color:#C8EED5;color:var(--green)}
.mg-item.ok .mg-k{color:var(--green);opacity:.75}
.mg-item.warn{background:var(--amber-soft);border-color:#FBE3B8;color:#8A5A08}
.mg-item.warn .mg-k{color:#8A5A08;opacity:.75}
.mg-item.fail{background:var(--red-soft);border-color:#F8D4D4;color:var(--red)}
.mg-item.fail .mg-k{color:var(--red);opacity:.75}
.mg-item.grey{color:var(--tx2)}
.rt-live{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex:none;animation:mgpulse 2s infinite}
/* 2026-09-10：实时监控台 —— 4 列信号卡（卡内右上角标图标） */
.stat-cards.c4{grid-template-columns:repeat(4,1fr)}

/* ============ 存储 ============ */

var KEY='wb_live_console_v2';

var DB={v:2,accounts:[],sessions:[],cfg:{seeded:false,tipDismiss:0}};



function save(){DB.localTs=Date.now();try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('保存失败：本地空间可能已满');}syncPush();}

function load(){

  try{var r=localStorage.getItem(KEY); if(r){DB=JSON.parse(r);}}catch(e){}

  if(!DB.accounts)DB.accounts=[]; if(!DB.sessions)DB.sessions=[]; if(!DB.accountsArch)DB.accountsArch=[]; if(!DB.sessionsArch)DB.sessionsArch=[]; if(!DB.cfg)DB.cfg={seeded:false,tipDismiss:0}; if(!DB.skips)DB.skips={}; if(!DB.cloud)DB.cloud={apiKey:'',binId:'',autoSync:true}; if(!DB.accAdd)DB.accAdd=[]; if(!DB.accDel)DB.accDel=[];

  if(DB.v!==2){DB={v:2,accounts:[],sessions:[],cfg:{seeded:false,tipDismiss:0}};}

  if(!DB.cfg.seeded){seed();DB.cfg.seeded=true;save();}

  /* 一次性迁移：将所有账号负责人重置为默认"点淘" */

  if(!DB.cfg.opReset){

    DB.accounts.forEach(function(a){a.operator='点淘';});

    DB.cfg.opReset=true;save();

  }

}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}



/* ============ 日期 ============ */

function today(){var d=new Date();return fmt(d);}

function fmt(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}

function dateAdd(ds,days){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+days);return fmt(d);}

function quickDate(q){

  var t=today();

  if(q==='today'){filterDateFrom=t;filterDateTo=t;}

  else if(q==='3d'){filterDateFrom=dateAdd(t,-2);filterDateTo=t;}

  else if(q==='7d'){filterDateFrom=dateAdd(t,-6);filterDateTo=t;}

  else if(q==='15d'){filterDateFrom=dateAdd(t,-14);filterDateTo=t;}

  else if(q==='30d'){filterDateFrom=dateAdd(t,-29);filterDateTo=t;}

  else{filterDateFrom='';filterDateTo='';}

  render();

}

function shift(n){var d=new Date();d.setDate(d.getDate()+n);return fmt(d);}

function diffDays(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000);}

function dow(ds){var d=new Date(ds+'T00:00:00');return d.getDay()===0?7:d.getDay();}

var DOWN=['','周一','周二','周三','周四','周五','周六','周日'];

/* 守护辅助：场次/停播/断播判断 */

function hasSession(accId,ds){for(var i=0;i<DB.sessions.length;i++){if(DB.sessions[i].acc===accId&&DB.sessions[i].date===ds)return true;}return false;}

function isPlannedDay(a,ds){return a.week&&a.week.length&&a.week.indexOf(dow(ds))>=0;}

function isBreakoff(a,ds){var t=today();if(ds>=t)return false;if(!isPlannedDay(a,ds))return false;if(hasSession(a.id,ds))return false;if(isSkipped(a.id,ds))return false;return true;}

function getAccSkips(accId){var r=[];if(!DB.skips)return r;for(var k in DB.skips){var p=k.split('_');if(p[1]===accId)r.push(p[0]);}return r.sort().reverse();}

function getAccBreakoffs(a,days){var t=today(),r=[];for(var i=1;i<=days;i++){var ds=dateAdd(t,-i);if(isBreakoff(a,ds))r.push(ds);}return r;}

function getAccGuardDays(accId,days){var t=today(),r=0;for(var i=0;i<days;i++){var ds=dateAdd(t,-i);if(hasSession(accId,ds))r++;}return r;}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ★ 2026-09-09 复盘报告显示层结构化（只影响渲染，复制/导出仍用原始纯文本）：
   章节行「N、xxx」→ 加粗标题；「- xxx」列表行 → 圆点缩进；空行 → 紧凑间隔。 */
function fmtReport(t){
  var ls=String(t||'').split('\n');
  var out='';
  for(var i=0;i<ls.length;i++){
    var ln=ls[i];
    if(!ln.trim()){out+='<div class="rpt-sp"></div>';continue;}
    var e=esc(ln);
    if(/^[一二三四五六七八九十]+、/.test(ln))out+='<div class="rpt-h">'+e+'</div>';
    else if(/^- /.test(ln))out+='<div class="rpt-li">'+e.replace(/^- /,'')+'</div>';
    else out+='<div class="rpt-p">'+e+'</div>';
  }
  return out;
}

function num(n){n=+n||0;return n.toLocaleString('zh-CN');}

function money(n){return '¥'+(+n||0).toLocaleString('zh-CN');}

function pct(n,d){d=d==null?1:d;n=+n||0;return n.toFixed(d)+'%';}

/* ============ 数据新鲜度 ============ */
/* 手机上看这个工作台，最怕的不是数据少，是不知道手里这份数据"旧到什么程度"——
   早上看的和昨晚看的长得一模一样，你根本分不清是今天没开播还是同步挂了。
   所以顶部常驻一行：数据更新于 XX · X 小时前 · 覆盖至 XX。
   超 12 小时转黄，超 24 小时转红，并给一个「刷新」按钮手动拉一次最新快照。
   （这句长期挂在这儿，比事后解释「哦那天同步挂了」有用得多。） */

var FRESH_WARN=12, FRESH_BAD=24;

function snapTs(){

  var s=DB.snapInfo&&DB.snapInfo.exportedAt?String(DB.snapInfo.exportedAt):'';

  var m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);

  if(!m)return 0;

  return new Date(+m[1],(+m[2])-1,+m[3],+(m[4]||0),+(m[5]||0),0).getTime();

}

/* 返回距今小时数；拿不到快照时间返回 -1（本地数据），机器时钟倒挂按 0 算 */

function snapAgeH(){

  var t=snapTs(); if(!t)return -1;

  var h=(Date.now()-t)/3600000;

  return h<0?0:h;

}

function ageText(h){

  if(h<1)return Math.max(1,Math.round(h*60))+' 分钟前';

  if(h<48)return Math.floor(h)+' 小时前';

  return Math.floor(h/24)+' 天前';

}

/* 同一个时长的另一种说法：接在「已 … 没更新」后面用，不该带「前」 */

function ageSpan(h){return ageText(h).replace('前','');}

function shortDate(d){d=String(d||'');return d.length>5?d.slice(5):d;}

function renderFreshness(){

  var host=document.getElementById('freshBar');

  if(!host)return;

  var si=DB.snapInfo||{}, exp=si.exportedAt||'', dd=shortDate(si.dataDate), h=snapAgeH();

  var btn='<button class="btn sm ghost" onclick="refreshSnapshot()" style="font-size:11.5px;padding:0 9px;min-height:26px;flex:0 0 auto;color:inherit;border-color:currentColor">刷新</button>';

  if(h<0){

    /* 还没读到服务端快照：要么首次加载，要么 workbench_data.json 没跟着一起发上来 */

    host.className='freshbar';

    host.innerHTML='<span class="fb-dot" style="background:#94A3B8"></span><span class="fb-t">本地数据 · 还没读到自动同步的快照</span>'+btn;

    return;

  }

  /* 健康态就一行小字，不摆按钮——页面本来就每 60 秒自动拉一次，
     真旧到要提醒了（黄/红）才值得让人手动点一下。 */

  if(h>=FRESH_BAD){

    host.className='freshbar bad';

    host.innerHTML=svg('alert')+'<span class="fb-t"><b>已 '+ageSpan(h)+'没更新</b> · 停在 '+esc(exp)+'。同步大概率断了，别拿这份数据做判断。</span>'+btn;

    return;

  }

  if(h>=FRESH_WARN){

    host.className='freshbar warn';

    host.innerHTML=svg('alert')+'<span class="fb-t"><b>已 '+ageSpan(h)+'没更新</b> · 停在 '+esc(exp)+(dd?(' · 覆盖至 '+esc(dd)):'')+'，今天的场次可能还没进来。</span>'+btn;

    return;

  }

  host.className='freshbar';

  host.innerHTML='<span class="fb-dot"></span><span class="fb-t">数据更新于 '+esc(exp)+' · '+ageText(h)+(dd?(' · 覆盖至 '+esc(dd)):'')+'</span>';

}

function refreshSnapshot(){

  var host=document.getElementById('freshBar');

  if(host)host.style.opacity='.5';

  loadSnapshot(function(updated){

    if(host)host.style.opacity='';

    render();

    if(updated)toast('已更新到 '+(DB.snapInfo&&DB.snapInfo.exportedAt||'最新'));

    else toast('服务器上还是同一份，同步任务还没跑新的');

  });

}

function skipKey(date,accId){return date+'_'+accId;}

function skipToday(accId){if(!DB.skips)DB.skips={};DB.skips[skipKey(today(),accId)]=true;save();render();toast('已标记为今日停播');}

function parseTimeMin(t){if(!t)return null;var m=t.match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}

/* ★ 2026-09-09 实时状态列时间感（师兄指出"始终不是实时"）：
   JSONBin 信标 rt 里有 started_at（今日 HH:MM:SS）/ended_at（ISO），
   直播时长列此前只认已落表的 ses.dur（下播后才有时长），在播永远是"直播中"两个字、已下播永远"—"。
   现在用 rt 现算：在播=已播分钟（随信标 5 分钟一跳），下播=started→ended 总时长。只读内存不 save。 */
function fmtDurMin(m){
  if(m==null||isNaN(m)||m<0)return null;
  var h=Math.floor(m/60),mm=m%60;
  return h>0?(h+'时'+(mm?(mm<10?'0':'')+mm+'分':'')):(m+'分');
}
function rtDurMin(a){
  var rt=a&&a.rt;
  if(!rt||!rt.started_at)return null;
  var d=new Date();
  var s=new Date(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(rt.started_at).trim().replace(/：/g,':')).getTime();
  if(isNaN(s))return null;
  var e=rt.ended_at?new Date(String(rt.ended_at).replace(/(\.\d{3})\d+$/,'$1')).getTime():Date.now();
  if(isNaN(e))e=Date.now();
  var m=Math.round((e-s)/60000);
  return (m>=0&&m<24*60)?m:null;
}

function liveStatus(a,todayS){

  /* ★ 2026-09-08：优先信实时工作台真状态（accounts[].rt，数据桥从 127.0.0.1:8765 并入）。
     以前没有 rt，只能拿「开播后 4 小时窗口 + 今日有守护」去猜 live / lost，
     于是播完的显示"直播中"、已停用的报"断播"（师兄 12:22 指出）。
     有 rt 就直接读 phase，不再猜；没有 rt（本机实时台没开）才降级回下面的推断。 */
  var rt=a.rt;
  if(rt&&rt.phase){
    var ph=String(rt.phase);
    /* 2026-09-09 补齐：ops_snapshot phase 共 10 种，旧版只认 5 种，
       缺的（守护中/崩溃/崩溃已恢复/收尾中/守护静止）落到下面推断分支，

    if(ph.indexOf('停用')>=0)return 'skipped';          /* 已停用 = 今日停播 */
    if(ph.indexOf('崩溃已恢复')>=0)return 'live';       /* 崩过但恢复了，仍在播 */
    if(ph.indexOf('崩溃')>=0)return 'lost';             /* 守护崩了 = 断播待处理 */
    if(ph.indexOf('直播')>=0)return 'live';             /* 真·正在播 */
    if(ph.indexOf('守护中')>=0)return 'live';           /* ★ 守护监护中=已开播（ops_snapshot 口径：至少进已开播列）*/
    if(ph.indexOf('收尾')>=0)return 'review_wait';      /* 收尾中 = 已下播，等复盘 */
    if(ph.indexOf('收工')>=0||ph.indexOf('下播')>=0){
      return rt.review_done?'done':'review_wait';       /* 播完了，看复盘没 */
    }
    if(ph.indexOf('守护静止')>=0)return 'lost';         /* 起过守护没产出 = 断播 */
    if(ph.indexOf('未启动')>=0)return 'pending';        /* 还没到点 */
    /* 其余未知 phase：落回推断 */
  }

  if(isSkipped(a.id,today()))return 'skipped';

  var ses=null;for(var i=0;i<todayS.length;i++){if(todayS[i].acc===a.id){ses=todayS[i];break;}}

  if(ses){
    /* 自动判定「断播」：已下播/已复盘但时长不足 60 分钟的异常早收 */
    var durMn=durToMin(ses.dur);
    if(durMn>0&&durMn<60)return 'short';
    if(ses.review&&ses.review.done)return 'done';
    return 'review_wait';
  }

  /* 无今日场次：按开播时间 + 合理直播窗口判断状态，避免下播几小时后仍显示「直播中」 */
  var nowMin=new Date().getHours()*60+new Date().getMinutes();

  var ltMin=parseTimeMin(a.liveTime);

  var guardedToday=String(a.lastGuard||'')>=today();

  if(ltMin===null)return 'pending';

  if(nowMin<ltMin)return 'pending';

  /* 已过开播时间但没数据：4 小时窗口内且今天有守护动作 → 可能仍在直播中；超出窗口仍无场次 → 断播/数据缺失 */

  var withinWindow=(nowMin-ltMin)<240;

  if(withinWindow&&guardedToday)return 'live';

  return 'lost';

}

var ST_MAP={

  pending:{cls:'st-pending',t:'未开播'},

  live:{cls:'st-live',t:'直播中'},

  review_wait:{cls:'st-offline',t:'已下播'},

  done:{cls:'st-done',t:'已完成'},

  skipped:{cls:'st-skip',t:'今日停播'},

  short:{cls:'st-lost',t:'断播'},

};

/* ============ 体系健康（守护 · 自检 · 自动化）2026-09-03 ============ */
/* 三块数据每天都在生成，但原先只躺在硬盘里，手机上完全看不见。
   现在数据桥带过来，这里画出来 —— 核心不是「跑没跑」，是「跑出什么结果」。
   教训：02:00 录屏转写天天 success，实际断供 20 天零产出。 */

function pcAgeH(){
  var p=DB.procheck; if(!p||!p.ts) return null;
  var d=new Date(String(p.ts).replace(' ','T'));
  if(isNaN(d.getTime())) return null;
  return (Date.now()-d.getTime())/3600000;
}

/* 兜底阈值：自检实际只有 20:55/22:15 两轮在跑，班次间隔最长 22 小时，
   所以"距今多久"不能当主判据（会每天早上误报）。主判据是后端算好的 missed
   （上一班该跑的点过了没落盘 = 真漏跑），这里只兜底那种彻底断更的情况。 */
var PC_STALE_H=48;

function guardLevel(){
  var g=DB.guard; if(!g) return null;
  var r=g.rate||0;
  if(!g.trustworthy||r<0.7||g.gapN>2) return 'fail';
  if(r<0.9||g.gapN>0||g.recheckN>0) return 'warn';
  return 'ok';
}

function sysHealth(){
  var g=DB.guard,p=DB.procheck,ar=DB.autoRuns,lvs=[],rows='';

  if(g){
    var lv=guardLevel(),pct=Math.round((g.rate||0)*100);
    var txt=(g.date?shortDate(g.date)+' ':'')+'守护成功率 '+pct+'%'
      +(g.gapN?(' · 缺口 '+g.gapN+' 场'):'')
      +(g.recheckN?(' · 待复查 '+g.recheckN+' 个'):'');
    if(!g.trustworthy)txt+=' · 数据不可信';
    lvs.push(lv);
    rows+='<div class="sh-row '+lv+'"><span class="sh-k">守护</span><span class="sh-v">'+esc(txt)+'</span>'
     +'<span class="pill '+lv+'">'+(lv==='ok'?'正常':(lv==='warn'?'注意':'异常'))+'</span></div>';
  }

  if(p){
    var ah=pcAgeH(),lv2='ok',lab='正常';
    var t2=(p.time||'—')+' · 窗口 '+p.window+' · 存活 '+p.alive+' · 重启 '+p.restarted
      +(p.failed?(' · 失败 '+p.failed):'')+(p.dark?(' · 未开播跳过 '+p.dark):'');
    if(ah===null){lv2='grey';lab='无时间';}
    else if(p.missed){
      /* 上一班该跑的自检点过了却没落盘 —— 这才是真漏跑（数据桥按真实班次算的） */
      lv2='fail';lab='漏跑了';
      t2='上一班自检 '+(p.expect||'—')+' 没跑成 · 最近一次停在 '+(p.time||'—');
    }
    else if(ah>PC_STALE_H){
      lv2='fail';lab='可能停了';
      t2='最近一次自检 '+(p.time||'—')+'（'+Math.floor(ah/24)+' 天前）· 自检任务可能停了';
    }
    else if(p.failed>0){lv2='fail';lab='有失败';}
    else if(p.restarted>0){lv2='warn';lab='有重启';}
    if(lv2!=='grey')lvs.push(lv2==='fail'?'fail':(lv2==='warn'?'warn':'ok'));
    else lvs.push('ok');
    rows+='<div class="sh-row '+lv2+'"><span class="sh-k">自检</span><span class="sh-v">'+esc(t2)+'</span>'
     +'<span class="pill '+lv2+'">'+lab+'</span></div>';
  }

  if(ar){
    var c=ar.counts||{};
    var bad=(c.warn||0)+(c.empty||0)+(c.stale||0)+(c.fail||0)+(c.never||0);
    var lv3=(c.fail||0)>0?'fail':(bad?'warn':'ok');
    var t3=(ar.total||0)+' 个任务 · 正常 '+(c.ok||0)
      +((c.fail||0)?(' · 失败 '+c.fail):'')
      +((c.empty||0)?(' · 零产出 '+c.empty):'')
      +((c.warn||0)?(' · 告警 '+c.warn):'')
      +((c.stale||0)?(' · 超期 '+c.stale):'')
      +((c.never||0)?(' · 从未跑 '+c.never):'');
    lvs.push(lv3);
    rows+='<div class="sh-row '+lv3+'"><span class="sh-k">自动</span><span class="sh-v">'+esc(t3)+'</span>'
     +'<span class="pill '+lv3+'">'+(lv3==='ok'?'正常':(lv3==='warn'?'注意':'异常'))+'</span></div>';
  }

  if(!rows)return '';
  var over='ok';
  for(var i=0;i<lvs.length;i++){if(lvs[i]==='fail'){over='fail';break;}if(lvs[i]==='warn')over='warn';}
  return {rows:rows,over:over};
}

function sysHealthCard(){
  var sh=sysHealth();
  if(!sh)return '';
  return '<div class="card" style="margin-bottom:12px">'
   +'<div class="card-h"><div class="ic" style="background:var(--pri-soft)">'+svg('shield')+'</div>'
   +'<h2 style="font-size:14px">体系健康</h2>'

   +'</div>'+sh.rows+'</div>';
}

   来由：师兄要「把管理条和实时监控台的数据和图标放进来，用我们有的数据」。
   铁律：字段只取 workbench_data.json 里真实存在的五个源 ——
        rtKpi / guardHealth / procheck / autoRuns / accounts[].rt，
        后端没有的一律不画，不编数、不推算。
   分工：管理条 = 顶部常驻细条，图标 + 数字，一眼看全局；
        实时监控台 = 今日概览里的详版，信号卡 + 明细行 + 在役账号实时态表。
   注意：这些是「快照类」字段，云同步包里被置 null（见 syncPush 白名单），
        只有 workbench_data.json 这一路有；取不到时整块不渲染，不留空壳。 */

/* 实时态配色（phase 取值来自后端 accounts[].rt.phase） */
var RT_PHASE = {
  '直播中': '#DC2626',
  '守护中': '#16A34A',
  '收尾中': '#3B82F6',
  '守护静止': '#D97706',
  '未启动': '#94A3B8',
  '已停用': '#94A3B8'
};

function rtPct(v) { return Math.round((+v || 0) * 100) + '%'; }

/* 采样距今小时数；拿不到时间就返回 null（不猜） */
function rtAgeH(ts) {
  if (!ts) return null;
  var d = new Date(String(ts).replace(' ', 'T'));
  if (isNaN(d.getTime())) return null;
  return (Date.now() - d.getTime()) / 3600000;
}

/* 自动化 / 自检 的等级判定：与 sysHealth 同口径，不另发明一套 */
function rtAutoLevel(ar) {
  if (!ar) return 'grey';
  var c = ar.counts || {};
  if ((c.fail || 0) > 0) return 'fail';
  if ((c.warn || 0) + (c.empty || 0) + (c.stale || 0) + (c.never || 0)) return 'warn';
  return 'ok';
}
function rtPcLevel(p) {
  if (!p) return 'grey';
  if (p.missed || (p.failed || 0) > 0) return 'fail';
  if ((p.restarted || 0) > 0 || (p.dark || 0) > 0) return 'warn';
  return 'ok';
}
function rtCardCls(lv) { return lv === 'fail' ? 'sc-red' : (lv === 'warn' ? 'sc-amber' : (lv === 'ok' ? 'sc-green' : 'sc-grey')); }
function rtPillCls(lv) { return lv === 'fail' ? 'fail' : (lv === 'warn' ? 'warn' : (lv === 'ok' ? 'ok' : 'grey')); }

/* 从 gen_at / ts 里抠出 HH:MM */
function rtHm(ts) {
  var s = String(ts || '');
  if (!s) return '—';
  if (s.indexOf(' ') > 0) return s.split(' ')[1].slice(0, 5);
  return s.slice(-5);
}

      var pk = (r.peak === null || r.peak === undefined) ? '—' : String(r.peak);
      h += '<tr><td style="font-weight:600">' + esc(a.name) + '</td>'
        + '<td><span style="color:' + pc + ';font-weight:700">' + esc(ph) + '</span></td>'
        + '<td>' + esc(r.guard_stage || '—') + '</td>'
        + '<td>' + (r.login_bad ? '<span style="color:var(--red);font-weight:700">异常</span>' : '正常') + '</td>'
        + '<td>' + esc(endT) + '</td><td>' + esc(pk) + '</td>'
        + '<td>' + (r.review_done ? '<span style="color:var(--green);font-weight:700">已复盘</span>' : esc(r.review_at || '—')) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div style="font-size:11px;color:var(--tx3);margin-top:7px">实时态来自实时监控屏采样；「收尾」为最近一次守护收尾时间，「复盘」为最近一次复盘时点。</div>';
  }

  h += '</div>';
  return h;
}

/* 收集异常。每条 {sev:'danger'|'warn'|'info', t:标题, s:一句说明, ts:排序戳} */
function buildAlerts(){
  var A=[],t=today(),i;

  /* 1. 守护健康度告警已移除（2026-09-08 师兄指令）：
     「昨晚守护校验不可信/校验有缺口」不在今日概览显示，体系健康 tab 已有完整呈现，不重复打扰。
     原 logic：g.trustworthy=false || pct<70% || gapN>2 → danger；gapN/recheckN>0 → info。 */

  /* 2. 今日应播未播（断播/lost）—— 注意跳过今日停播与今天还没到点的 */
  var nowMin=new Date().getHours()*60+new Date().getMinutes();
  var todayS=DB.sessions.filter(function(s){return s.date===t;});
  var lostList=[];
  DB.accounts.forEach(function(a){
    if(!(a.week&&a.week.indexOf(dow(t))>=0))return;      /* 今天本来就休 */
    if(isSkipped(a.id,t))return;                          /* 手动停播不算 */
    /* 2026-09-09：rt 真状态优先——实时屏明确知道账号在干嘛（直播中/守护中/已收工）
       就别用「守护记录+今日场次」猜「该开播却还没播」。守护看板_*.json 09-08 起断供，
       lastGuard 停在 09-07，旧判定把泊涵/丹丹老师/雨晨上午三个在播账号全误报。
       只有 rt 说「未启动/停用/静止」或无 rt 才走旧推断。 */
    if(a.rt&&a.rt.phase){
      var _ph=String(a.rt.phase);
      if(_ph.indexOf('未启动')<0&&_ph.indexOf('停用')<0&&_ph.indexOf('静止')<0)return;
    }
    var ltMin=parseTimeMin(a.liveTime);
    if(ltMin===null||nowMin<ltMin)return;                 /* 还没到点或没排时间 */
    var has=hasSession(a.id,t);
    var guardedToday=String(a.lastGuard||'')>=t;
    if(!has&&!guardedToday)lostList.push({n:a.name,lt:a.liveTime});
  });
  if(lostList.length){
    A.push({sev:lostList.length>1?'danger':'warn',
      t:lostList.length+' 个账号该开播却还没播',
      s:lostList.map(function(x){return x.n+'('+x.lt+')';}).join('、')+' —— 要么守护没抓到，要么真没开',
      ts:2});
  }

  /* 3. 登录态失效/久未刷新 */
  DB.accounts.forEach(function(a){
    var d=a.lastGuard?diffDays(a.lastGuard,t):999;
    if(a.auth==='fail'){
      A.push({sev:'danger',t:a.name+' 登录态已失效',s:'上次守护 '+(a.lastGuard||'未记录')+'，需重登后台，否则守护会抓空',ts:3});
    }else if(d>=7&&d<999){
      A.push({sev:'warn',t:a.name+' 登录态已 '+d+' 天没刷',s:'建议重登，避免守护中断',ts:4});
    }
  });

  /* 4. 话术稿断供：有 transcripts 但最近 3 天没新的 */
  var tr=DB.transcripts;
  if(tr&&tr.length){
    var maxD='';
    for(i=0;i<tr.length;i++){if(tr[i].date>maxD)maxD=tr[i].date;}
    var age=diffDays(maxD,t);
    if(age>=3){
      A.push({sev:age>=7?'warn':'info',t:'录屏转写已 '+age+' 天没新稿',
        s:'最新一篇 '+maxD+' —— 去看看「体系健康」里转写任务是不是零产出了',ts:5});
    }
  }

  /* 5. 复盘欠账：非今日的已下播场次有 review 待生成堆积（今日的由今日面板管） */
  var owe=[];
  for(i=0;i<DB.sessions.length;i++){
    var s=DB.sessions[i];
    if(s.date===t)continue;
    if(s.date<t&&s.dur&&(!s.review||!s.review.done))owe.push(s);
  }
  if(owe.length>=3){
    A.push({sev:'info',t:'有 '+owe.length+' 场历史直播复盘没做',
      s:'最早 '+owe[0].date+' · 去「复盘报告」页补',ts:6});
  }

  return A;
}

  var L=['# 需要你处理'];

/* 2026-09-08：状态数据卡 5 张（今日概览顶部）
   字段围绕"今日直播进度"：在播 → 播完待复盘 → 已复盘，串成一条今日漏斗。
   风格：彩色左条 + 大数字 + 描述 + 底色横线（见 .stat-cards / .stat-card）。
   数据源全部前端有：下一场算 planned 最近 liveTime；直播中算 liveStatus==='live' 数；
   已下播算 liveStatus==='review_wait' 数（口径同 ST_MAP，不重复统计 done/short/lost）；
   复盘算 done/todayS；数据新鲜读 DB.snapInfo.exportedAt。
   没用编数据：CDP 11/11 那种字段前端没有，不强加。 */

function statCardsRow(t,todayS,planned){
  /* 1) 下一场倒计时：从 planned 里找最近的「未来」liveTime；已过开播时间但宽限内未开播的归"即将开播"（不再显示负数） */
  var nxt=null, nxtSoon=null;
  for(var i=0;i<planned.length;i++){
    var a=planned[i];
    if(!a.liveTime)continue;
    var mins=parseTimeMin(a.liveTime);
    if(mins==null)continue;
    var nowM=new Date().getHours()*60+new Date().getMinutes();
    var diff=mins-nowM;
    if(diff<-30)continue;                 /* 超过 30 分钟还没开播/没数据：归断播/缺失，不计入"下一场" */
    if(diff<0){
      /* 已过开播时间：正在播的归"直播中"卡；其余 30 分钟内算"即将开播" */
      if(liveStatus(a,todayS)==='live')continue;
      if(nxtSoon==null||diff>nxtSoon.diff)nxtSoon={acc:a.name,time:a.liveTime,diff:diff};
      continue;
    }
    if(nxt==null||diff<nxt.diff)nxt={acc:a.name,time:a.liveTime,diff:diff};
  }
  var card1='';
  if(nxt){
    var dh=Math.floor(nxt.diff/60),dm=nxt.diff%60;
    var dStr=dh>0?(dh+'小时'+(dm>0?dm+'分':'分')):(nxt.diff+'分');
    card1='<div class="stat-card sc-purple"><div class="sc-l">下一场开播</div><div class="sc-v">'+dStr+'</div><div class="sc-d">'+esc(nxt.acc)+' '+esc(nxt.time)+'</div><div class="sc-bar"></div></div>';
  }else if(nxtSoon){
    card1='<div class="stat-card sc-purple"><div class="sc-l">下一场开播</div><div class="sc-v">即将开播</div><div class="sc-d">'+esc(nxtSoon.acc)+' '+esc(nxtSoon.time)+' 已到点</div><div class="sc-bar"></div></div>';
  }else{
    card1='<div class="stat-card sc-grey"><div class="sc-l">下一场开播</div><div class="sc-v">—</div><div class="sc-d">今日已无场</div><div class="sc-bar"></div></div>';
  }

  /* 2) 直播中账号：liveStatus==='live' 数 / planned 总数 */
  var liveN=0;
  for(var j=0;j<planned.length;j++){
    if(liveStatus(planned[j],todayS)==='live')liveN++;
  }
  var liveColor=liveN>0?'sc-red':(planned.length>0?'sc-blue':'sc-grey');
  card1+='<div class="stat-card '+liveColor+'"><div class="sc-l">直播中</div><div class="sc-v">'+liveN+'/'+planned.length+'</div><div class="sc-d">'+(liveN>0?(liveN+' 个账号正在直播'):'当前无直播')+'</div><div class="sc-bar"></div></div>';

  /* 3) 已下播：liveStatus==='review_wait' 数 / 今日计划数
     口径同 ST_MAP.review_wait='已下播'（播完但还没复盘）。
     done=已复盘、short/lost=断播 都不计入本卡，避免和卡 4「今日复盘」重复统计。 */
  var offN=0;
  for(var m=0;m<planned.length;m++){
    if(liveStatus(planned[m],todayS)==='review_wait')offN++;
  }
  var oColor=offN>0?'sc-amber':(todayS.length>0?'sc-green':(planned.length>0?'sc-blue':'sc-grey'));
  var oD=offN>0?(offN+' 场播完待复盘'):(todayS.length>0?'今日已播完':'今日暂无下播');
  var card3='<div class="stat-card '+oColor+'"><div class="sc-l">已下播</div><div class="sc-v">'+offN+'/'+planned.length+'</div><div class="sc-d">'+esc(oD)+'</div><div class="sc-bar"></div></div>';

  /* 4) 今日复盘：rvDone / todayS（今日总场次 = 计划中已开播/已复盘/直播中/待复盘 全部） */
  var doneN=0;
  for(var k=0;k<planned.length;k++){
    if(liveStatus(planned[k],todayS)==='done')doneN++;
  }
  var totalN=todayS.length;
  var rColor=doneN>=totalN&&totalN>0?'sc-green':(doneN>0?'sc-amber':(totalN>0?'sc-red':'sc-grey'));
  card3+='<div class="stat-card '+rColor+'"><div class="sc-l">今日复盘</div><div class="sc-v">'+doneN+'/'+totalN+'</div><div class="sc-d">'+(totalN>0?('已完成 '+doneN+' 场'):'今日暂无场次')+'</div><div class="sc-bar"></div></div>';

  /* 5) 数据新鲜度：DB.snapInfo.exportedAt 距今 */
  var stInfo=DB.snapInfo;
  var freshColor='sc-grey',freshV='—',freshD='暂无数据';
  if(stInfo&&stInfo.exportedAt){
    var exp=new Date(String(stInfo.exportedAt).replace(' ','T'));
    if(!isNaN(exp.getTime())){
      var ageMs=Date.now()-exp.getTime();
      var ageH=ageMs/3600000;
      if(ageH<3){freshColor='sc-green';freshV=ageH.toFixed(1)+'h';}
      else if(ageH<12){freshColor='sc-blue';freshV=ageH.toFixed(1)+'h';}
      else if(ageH<24){freshColor='sc-amber';freshV=Math.round(ageH)+'h';}
      else{freshColor='sc-red';freshV=Math.round(ageH/24)+'天';}
      freshD=shortDate(stInfo.exportedAt)+' 导出';
    }
  }
  /* B 兜底提示：rt 在不在，决定上面这几张卡「可不可信」——必须一眼看见。
     以前缺这句，于是播完的显示「直播中」、已停用的报「断播」，没人知道那是猜的。 */
  var gAt=String((DB.rtKpi&&DB.rtKpi.gen_at)||'');
  var gTm=gAt.indexOf(' ')>=0?gAt.split(' ')[1].slice(0,5):gAt.slice(-5);
  var tip=DB.rtKpi&&DB.rtKpi.gen_at
    ? '<div class="rt-tip ok"><i></i>实时状态已同步 '+esc(gTm)+' · 来自实时监控屏</div>'
    : '<div class="rt-tip warn"><i></i>实时状态未同步 · 以下为推断值，准确状态看实时监控屏</div>';

/* 折线图游标：鼠标/手指移到图上时显示竖直游标线，并跟随显示该点数值 */
function lcHover(ev,el){
  var svg=el&&el.ownerSVGElement;if(!svg)return;
  var r=el.getBoundingClientRect();if(!r.width)return;
  var evx=(ev.touches&&ev.touches[0])?ev.touches[0].clientX:ev.clientX;
  var W=680,mx=(evx-r.left)/r.width*W;
  var pts=(el.getAttribute('data-pts')||'').split('|');
  var labels=(el.getAttribute('data-labels')||'').split('|');
  var vals=(el.getAttribute('data-vals')||'').split('|');
  var unit=el.getAttribute('data-unit')||'';
  var color=el.getAttribute('data-color')||'#4F46E5';
  var bi=-1,bd=1e9;
  for(var i=0;i<pts.length;i++){var p=pts[i].split(',');if(p.length<2)continue;var dx=Math.abs(parseFloat(p[0])-mx);if(dx<bd){bd=dx;bi=i;}}
  if(bi<0)return;
  var pp=pts[bi].split(','),cx=parseFloat(pp[0]),cy=parseFloat(pp[1]);
  var g=svg.querySelector('.lc-tip');if(!g)return;
  g.style.display='';
  var cur=g.querySelector('.lc-cur');if(cur){cur.setAttribute('x1',cx.toFixed(1));cur.setAttribute('x2',cx.toFixed(1));}
  var dot=g.querySelector('.lc-dot');if(dot){dot.setAttribute('cx',cx.toFixed(1));dot.setAttribute('cy',cy.toFixed(1));dot.setAttribute('fill',color);}
  var lab=labels[bi]||'',val=(vals[bi]==null?'':String(vals[bi]));
  var t1=g.querySelector('.lc-t1'),t2=g.querySelector('.lc-t2');
  if(t1)t1.textContent=lab;
  if(t2)t2.textContent=val+unit;
  var bw=Math.max(54,lab.length*7+(val+unit).length*7+22);
  var bx=cx+12;if(bx+bw>W-6)bx=cx-12-bw;if(bx<4)bx=4;
  var by=Math.max(4,Math.min(cy-38,192));
  var br0=g.querySelector('.lc-box rect');
  if(br0){br0.setAttribute('x',bx.toFixed(1));br0.setAttribute('y',by.toFixed(1));br0.setAttribute('width',bw.toFixed(1));}
  if(t1){t1.setAttribute('x',(bx+8).toFixed(1));t1.setAttribute('y',(by+15).toFixed(1));}
  if(t2){t2.setAttribute('x',(bx+8).toFixed(1));t2.setAttribute('y',(by+28).toFixed(1));}
}
function lcLeave(el){
  var svg=el&&el.ownerSVGElement;if(!svg)return;
  var g=svg.querySelector('.lc-tip');if(g)g.style.display='none';
}

function lineChart(pts,labels,color,unit){

  var W=680,H=230,pl=44,pr=14,pt=16,pb=32;

  if(!pts.length)return '<div class="empty">'+svg('inbox')+'暂无数据</div>';

  var max=Math.max.apply(null,pts),min=Math.min.apply(null,pts);

  if(max===min){max=max||1;min=0;}

  var pad=(max-min)*0.15;max+=pad;min=Math.max(0,min-pad);

  var iw=W-pl-pr,ih=H-pt-pb;

  var x=function(i){return pts.length===1?pl+iw/2:pl+iw*i/(pts.length-1);};

  var y=function(v){return pt+ih-(v-min)/(max-min)*ih;};

  var g='',i;

  for(i=0;i<=4;i++){

    var gy=pt+ih*i/4,val=max-(max-min)*i/4;

    g+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="#EDEFF6" stroke-width="1"/>';

    g+='<text x="'+(pl-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#8A90A8">'+(max<10?val.toFixed(1):Math.round(val))+'</text>';

  }

  var d='',ar='';

  for(i=0;i<pts.length;i++){d+=(i?' L':'M')+x(i).toFixed(1)+' '+y(pts[i]).toFixed(1);}

  ar='M'+x(0).toFixed(1)+' '+(pt+ih)+' L'+d.slice(1)+' L'+x(pts.length-1).toFixed(1)+' '+(pt+ih)+' Z';

  var dots='';

  for(i=0;i<pts.length;i++){

    dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(pts[i]).toFixed(1)+'" r="3.5" fill="#fff" stroke="'+color+'" stroke-width="2"><title>'+labels[i]+'：'+pts[i]+(unit||'')+'</title></circle>';

  }

  var xl='';var step=Math.ceil(pts.length/6);

  for(i=0;i<pts.length;i++){ if(i%step===0||i===pts.length-1)

    xl+='<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="#8A90A8">'+labels[i]+'</text>';}

  // 游标层：竖直游标线 + 高亮点 + 跟随数值气泡（默认隐藏，鼠标/手指移入时由 lcHover 定位显示）
  var pAttr=[];
  for(i=0;i<pts.length;i++){pAttr.push(x(i).toFixed(1)+','+y(pts[i]).toFixed(1));}

  var lcCursor='<g class="lc-tip" style="display:none">'
    +'<line class="lc-cur" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>'
    +'<circle class="lc-dot" cx="0" cy="0" r="5" fill="'+color+'" stroke="#fff" stroke-width="2"/>'
    +'<g class="lc-box"><rect x="0" y="0" rx="6" width="10" height="34" fill="#1F2437" opacity="0.92"/>'
    +'<text class="lc-t1" x="0" y="0" font-size="12" font-weight="700" fill="#fff"></text>'
    +'<text class="lc-t2" x="0" y="0" font-size="11" fill="#CBD5E1"></text></g></g>';

  var lcHit='<rect class="lc-hit" x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"'
    +' data-pts="'+pAttr.join('|')+'" data-labels="'+labels.join('|')+'" data-vals="'+pts.join('|')+'"'
    +' data-unit="'+(unit||'')+'" data-color="'+color+'"'
    +' onmousemove="lcHover(event,this)" onmouseleave="lcLeave(this)"'
    +' ontouchstart="lcHover(event,this)" ontouchmove="lcHover(event,this)" ontouchend="lcLeave(this)"/>';

  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'

    +'<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'

    +g+'<path d="'+ar+'" fill="url(#lg1)"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+dots+xl+lcCursor+lcHit+'</svg></div>';

}

function smoothPath(pts){

  if(pts.length<2)return pts.length?('M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1)):'';

  if(pts.length===2)return 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1)+' L'+pts[1][0].toFixed(1)+' '+pts[1][1].toFixed(1);

  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);

  for(var i=0;i<pts.length-1;i++){

    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;

    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;

    var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;

    d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);

  }

  return d;

}

function multiLineChart(series,labels){

  var W=680,H=250,pl=56,pr=14,pt=18,pb=36;

  var n=labels.length,nl=series.length;

  if(!nl||!n)return '<div class="empty">'+svg('inbox')+'暂无数据</div>';

  var all=[];

  series.forEach(function(s){s.pts.forEach(function(v){all.push(+v||0);});});

  var max=Math.max.apply(null,all)||1,min=0;

  var pad=(max-min)*0.12;max+=pad;

  var iw=W-pl-pr,ih=H-pt-pb;

  var x=function(j){return n===1?pl+iw/2:pl+iw*j/(n-1);};

  var y=function(v){return pt+ih-(v-min)/(max-min)*ih;};

  var g='',i;

  for(i=0;i<=4;i++){

    var gy=pt+ih*i/4,val=max-(max-min)*i/4;

    g+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="#EDEFF6" stroke-width="1"/>';

    g+='<text x="'+(pl-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#8A90A8">'+num(Math.round(val))+'</text>';

  }

  var paths='',dots='';

  series.forEach(function(s){

    var pts=s.pts.map(function(v,j){return [x(j),y(+v||0)];});

    paths+='<path d="'+smoothPath(pts)+'" fill="none" stroke="'+s.c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>';

    s.pts.forEach(function(v,j){

      dots+='<circle cx="'+x(j).toFixed(1)+'" cy="'+y(+v||0).toFixed(1)+'" r="3.5" fill="#fff" stroke="'+s.c+'" stroke-width="2"><title>'+s.n+' '+labels[j]+'：'+num(+v||0)+'</title></circle>';

    });

  });

  var xl='';

  for(i=0;i<n;i++){

    xl+='<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="#8A90A8">'+esc(labels[i])+'</text>';

  }

  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+paths+dots+xl+'</svg></div>';

}

function barChart(items){

  var W=680,H=Math.max(120,items.length*44+20),pl=108,pr=140;

  if(!items.length)return '<div class="empty">'+svg('inbox')+'暂无数据</div>';

  var max=Math.max.apply(null,items.map(function(i){return i.v;}))||1;

  var iw=W-pl-pr,s='';

  items.forEach(function(it,i){

    var y=12+i*44,w=Math.max(3,iw*it.v/max);

    s+='<text x="'+(pl-10)+'" y="'+(y+18)+'" text-anchor="end" font-size="12" fill="#5B6079">'+esc(it.n.length>9?it.n.slice(0,9)+'…':it.n)+'</text>';

    s+='<rect x="'+pl+'" y="'+y+'" width="'+iw+'" height="24" rx="7" fill="#F2F3F9"/>';

    s+='<rect x="'+pl+'" y="'+y+'" width="'+w.toFixed(1)+'" height="24" rx="7" fill="'+it.c+'"/>';

    s+='<text x="'+(pl+iw+8)+'" y="'+(y+17)+'" font-size="12" font-weight="700" fill="#1B1D29">'+it.lb+'</text>';

  });

  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+s+'</svg></div>';

}

/* 纵向柱状图（适合"按月/按日"这类时间轴）；
   fmt 用于 Y 轴与柱顶数值格式化；值为 0 的柱子画成浅灰占位，保持 12 个月骨架完整 */
function colChart(pts,labels,color,fmt){
  var W=680,H=252,pl=58,pr=14,pt=22,pb=42;
  if(!pts.length)return '<div class="empty">'+svg('inbox')+'暂无数据</div>';
  var f=fmt||function(v){return Math.round(v);};
  var max=Math.max.apply(null,pts)||1;
  var iw=W-pl-pr,ih=H-pt-pb;
  var slot=iw/pts.length,gap=Math.min(12,slot*0.3),bw=slot-gap;
  var s='',i;
  for(i=0;i<=4;i++){
    var gy=pt+ih*i/4,val=max-max*i/4;
    s+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="#EDEFF6" stroke-width="1"/>';
    s+='<text x="'+(pl-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#8A90A8">'+f(val)+'</text>';
  }
  for(i=0;i<pts.length;i++){
    var x=pl+slot*i+gap/2;
    var v=+pts[i]||0;
    var hgt=v>0?Math.max(3,ih*v/max):2;
    var y=pt+ih-hgt;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="5" fill="'+(v>0?color:'#E9EBF3')+'"><title>'+labels[i]+'：'+f(v)+'</title></rect>';
    if(v>0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#1B1D29">'+f(v)+'</text>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle" font-size="10.5" fill="#8A90A8">'+labels[i]+'</text>';
  }
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+s+'</svg></div>';
}

function ring(pct,label,sub){

  var r=52,c=2*Math.PI*r,off=c*(1-Math.min(1,pct));

  return '<div class="chartbox" style="max-width:180px;margin:0 auto"><svg viewBox="0 0 140 140">'

   +'<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#EEF0F7" stroke-width="14"/>'

   +'<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#4F46E5" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 70 70)"/>'

   +'<text x="70" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="#1B1D29">'+label+'</text>'

   +'<text x="70" y="88" text-anchor="middle" font-size="11" fill="#8A90A8">'+sub+'</text></svg></div>';

}



/* ============ 视图：直播看板 ============ */

var chartMetric='views';

var trendAcc=''; /* 近 12 场趋势的账号筛选：'' = 全部账号 */

function setTrendAcc(v){trendAcc=v||'';render();}

var METRICS={peak:{n:'最高在线',c:'#4F46E5',u:' 人'},enter:{n:'最高进入',c:'#0EA5E9',u:' 人'},expose:{n:'曝光量',c:'#7C6BF0',u:''},views:{n:'累计观看',c:'#16A34A',u:' 人次'},fans:{n:'新增粉丝',c:'#D97706',u:' 人'},avgOnline:{n:'平均在线',c:'#EC4899',u:' 人'}};

function viewDash(){

  var all=sortedSessions();

  var w7=all.filter(function(s){return diffDays(s.date,today())<7;});

  var p7=all.filter(function(s){var d=diffDays(s.date,today());return d>=7&&d<14;});

  var sum=function(arr,k){return arr.reduce(function(a,b){return a+(+b[k]||0);},0);};

  var avg=function(arr,k){return arr.length?Math.round(sum(arr,k)/arr.length):0;};

  var delta=function(a,b){if(!b)return '';var p=((a-b)/b*100);return '<span class="'+(p>=0?'up':'down')+'">'+(p>=0?'▲':'▼')+Math.abs(p).toFixed(1)+'%</span> 较上周';};



  // 账号汇总（按类目）— 提前定义，汇总表置顶用
  /* 只取每个账号“最新一场”的数据（all 已按日期降序），横向对比当前状态；

     cnt 保留累计总场次；gmvYear=近 12 个月成交累计（汇总表用），
     gmvMonth=本月成交合计（两翼成交卡+饼图用；月初无成交时显示空态）。 */
  var byAccOf=function(cat){

    return DB.accounts.filter(function(a){return accCat(a)===cat;}).map(function(a){

      /* 同日多场时取开播时间最晚的那场，保证"最新一场"取数稳定 */

      var ss=all.filter(function(s){return s.acc===a.id;}).sort(function(x,y){

        if(x.date!==y.date)return x.date<y.date?1:-1;

        return (x.liveTime||'')<(y.liveTime||'')?1:-1;

      });

      var yearStart=dateAdd(today(),-364);

      var ssY=ss.filter(function(s){return s.date>=yearStart;});

      var last=ss.length?ss[0]:null;

      return {a:a,n:a.name,cnt:ss.length,

        date:last?(last.date||''):'',

        peak:last?(+last.peak||0):0,

        enter:last?(+last.enter||0):0,

        views:last?(+last.views||0):0,

        expose:last?(+last.expose||0):0,

        fans:last?(+last.fans||0):0,

        gmvYear:sum(ssY,'gmv'),

      gmvMonth:sum(ss.filter(function(s){return (s.date||'').slice(0,7)===(today()).slice(0,7);}),'gmv')};

    }).sort(function(x,y){return y.gmvYear-x.gmvYear;});

  };

  var tableRows=function(cat){

    var src=byAccOf(cat); /* 含 cnt/gmvMonth 等，按当月 GMV 降序（供月成交额排行用） */
    /* 账号汇总表按场次数据"主播与直播信息"的账号顺序（= 手机端数据快照顺序）排列，与之同步 */
    var ord={};DB.accounts.forEach(function(a,idx){if(accCat(a)===cat)ord[a.id]=idx;});
    var arr=src.slice().sort(function(x,y){return (ord[x.a.id]==null?999:ord[x.a.id])-(ord[y.a.id]==null?999:ord[y.a.id]);});var rows='';

    arr.forEach(function(x,i){

      rows+='<tr><td><b>'+(i+1)+'</b></td><td>'+catPill(x.a)+'</td><td>'+esc(x.n)+'</td><td>'+authPill(x.a.auth)+'</td><td>'+x.cnt+'</td><td>'+(x.date?x.date.slice(5):'—')+'</td><td>'+num(x.peak)+'</td><td>'+num(x.enter)+'</td><td>'+num(x.views)+'</td><td>'+num(x.expose)+'</td><td>'+num(x.fans)+'</td></tr>';

    });

    return rows;

  };

  /* 表头：除"总场次"外，数值列均为该账号最新一场的数据 */
  var tblHead='<tr><th>#</th><th>类目</th><th>账号</th><th>守护</th><th>总场次</th><th>最新场次</th><th>峰值在线</th><th>最高进入</th><th>观看人次</th><th>曝光次数</th><th>新增粉丝</th></tr>';



  // KPI 总览（置顶）— 4 个核心指标

  var h='<div class="card" style="border:1.5px solid #4F46E5;box-shadow:0 4px 16px rgba(79,70,229,.10)"><div class="card-h"><div class="ic" style="background:#4F46E5;color:#fff">'+svg('bolt')+'</div><h2 style="color:#4F46E5">近 7 天核心数据</h2><span class="pill" style="background:#EEF2FF;color:#4F46E5;font-weight:700">TOP</span><span class="pill grey">较上周对比</span></div>'

   +'<div class="kpis">'

   +kpi('近 7 天场次',w7.length+' 场',delta(w7.length,p7.length))

   +kpi('累计涨粉',num(sum(w7,'fans')),delta(sum(w7,'fans'),sum(p7,'fans')))

   +kpi('累计曝光次数',num(sum(w7,'expose')),delta(sum(w7,'expose'),sum(p7,'expose')))

   +kpi('累计成交',money(sum(w7,'gmv')),delta(sum(w7,'gmv'),sum(p7,'gmv')))

   +'</div></div><div class="sp"></div>';



  // 账号汇总（按类目）

  h+='<div class="card"><div class="card-h"><div class="ic">'+svg('list')+'</div><h2>账号数据汇总（最新场次数据）</h2></div>'

   +'<div class="scrollx"><table class="tbl"><thead>'+tblHead+'</thead><tbody>'

   +'<tr><td colspan="11" style="background:rgba(79,70,229,0.06);color:#4F46E5;font-weight:700;padding:8px 12px">'+CAT_LABEL.zy+'（'+byAccOf('zy').length+' 个账号）</td></tr>'

   +(tableRows('zy')||'<tr><td colspan="11" style="color:var(--tx3)">暂无账号</td></tr>')

   +'<tr><td colspan="11" style="background:rgba(219,39,119,0.06);color:#DB2777;font-weight:700;padding:8px 12px">'+CAT_LABEL.zy2+'（'+byAccOf('zy2').length+' 个账号）</td></tr>'

   +(tableRows('zy2')||'<tr><td colspan="11" style="color:var(--tx3)">暂无账号</td></tr>')

   +'</tbody></table></div></div><div class="sp"></div>';



  // 按类目分组近7天数据，便于同类对比

  var w7zy=w7.filter(function(s){return accCat(accById(s.acc))==='zy';});

  var w7zy2=w7.filter(function(s){return accCat(accById(s.acc))==='zy2';});

  var p7zy=p7.filter(function(s){return accCat(accById(s.acc))==='zy';});

  var p7zy2=p7.filter(function(s){return accCat(accById(s.acc))==='zy2';});



  // 类目对比卡片

  var catCard=function(cat,label,color,w,p){

    var nW=w.length,nP=p.length;

    var sV=sum(w,'views'),sE=sum(w,'expose'),sF=sum(w,'fans'),sG=sum(w,'gmv');

    var pV=sum(p,'views'),pE=sum(p,'expose'),pF=sum(p,'fans'),pG=sum(p,'gmv');

    var rate=function(a,b){return b?(a/b*100):0;};

    var days=function(L){var o={};L.forEach(function(s){if(s.date)o[s.date]=1;});return Object.keys(o).length;};

    var tavg=function(L){var vs=L.map(function(s){return parseFloat(s.thousandGmv);}).filter(function(v){return !isNaN(v)&&v>0;});return vs.length?Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length*100)/100:0;};

    var cmp=function(a,b){if(!b)return '上周无可比数据';if(a===b)return '与上周持平';return (a>b?'高于':'低于')+'上周 '+Math.abs((a-b)/b*100).toFixed(1)+'%';};

    var aV=nW?Math.round(sV/nW):0,bV=nP?Math.round(pV/nP):0;

    var aC=rate(sV,sE),bC=rate(pV,pE);

    var aF=rate(sF,sV),bF=rate(pF,pV);

    var ecomW=w.filter(function(s){return +s.gmv>0;}).length,ecomP=p.filter(function(s){return +s.gmv>0;}).length;

    var aFan=nW?Math.round(sF/nW):0,bFan=nP?Math.round(pF/nP):0;

    var aT=tavg(w),bT=tavg(p);

    /* 流量类新模块（师兄 2026-09-03：每周仅约 2 场带货，直播看板以流量指标为主，GMV 类不稳） */
    var _ir=function(L){var vs=L.map(function(s){return parseFloat(s.viewInterRate);}).filter(function(v){return !isNaN(v);});return vs.length?vs.reduce(function(a,b){return a+b;},0)/vs.length:0;};
    var _vw=function(L){var vs=L.filter(function(s){return s.avgView;}).map(function(s){return durToMin(s.avgView);});return vs.length?vs.reduce(function(a,b){return a+b;},0)/vs.length:0;};
    var aInter=_ir(w),bInter=_ir(p);
    var aView=_vw(w),bView=_vw(p);
    var aTeam=nW?Math.round(sum(w,'teamAdd')/nW):0,bTeam=nP?Math.round(sum(p,'teamAdd')/nP):0;
    var fmtView=function(mn){var s=Math.round((mn||0)*60),m=Math.floor(s/60),x=s%60;return m?(m+'分'+(x?x+'秒':'')):(x?x+'秒':'—');};

    h+='<div class="card"><div class="card-h"><div class="ic" style="background:'+color+'20;color:'+color+'">'+svg('grid')+'</div><h2 style="color:'+color+'">'+label+' 类目统计</h2><span class="pill" style="background:'+color+'15;color:'+color+';font-weight:600">'+w.length+' 场 / '+DB.accounts.filter(function(a){return accCat(a)===cat;}).length+' 账号</span></div>'

    if(!nW){

      h+='<div style="padding:14px 2px;color:#94A3B8;font-size:12.5px">近 7 天该类目没有直播场次，暂无数据可对比。</div></div>';

      return;

    }

     var cards=''

     +kpi2('场均观看',num(aV)+' 人',aV,bV,'→ 平均一场进房 '+num(aV)+' 人次，'+cmp(aV,bV)+'。',color)

     +kpi2('曝光→观看',aC.toFixed(1)+'%',aC,bC,'→ 每 100 次曝光有 '+aC.toFixed(1)+' 人点进来，'+cmp(aC,bC)+'；偏低就换封面和标题。',color)

     +kpi2('涨粉率',aF.toFixed(2)+'%',aF,bF,'→ 每 100 个观众留下 '+aF.toFixed(2)+' 个粉丝，'+cmp(aF,bF)+'。',color)

     +kpi2('成交场占比',(nW?Math.round(ecomW/nW*100):0)+'%',ecomW,ecomP,'→ 近 7 天 '+nW+' 场里 '+ecomW+' 场是带货直播，'+(ecomW?'其余是纯直播，成交栏空着属正常。':'本周全是纯直播，成交栏为空属正常。'),color)

     +((sG>0||pG>0)

        ?kpi2('千次观看成交',aT?('¥'+aT):'—',aT,bT,'→ 每 1000 次观看成交 '+(aT?('¥'+aT):'暂无数据')+'，'+cmp(aT,bT)+'。',color)

        :kpi2('场均新增粉丝',num(aFan)+' 人',aFan,bFan,'→ 平均每场涨 '+num(aFan)+' 粉，'+cmp(aFan,bFan)+'。',color))

     +kpi2('观看-互动率',aInter.toFixed(2)+'%',aInter,bInter,'→ 每 100 个观众产生 '+aInter.toFixed(2)+' 次互动，'+cmp(aInter,bInter)+'；偏低就加福袋和提问钩子拉互动。',color)
     +kpi2('人均观看时长',fmtView(aView),aView,bView,'→ 观众平均停留 '+fmtView(aView)+'，'+cmp(aView,bView)+'；越长说明内容越留得住人。',color)
     +kpi2('新加粉丝团人数',num(aTeam)+' 人',aTeam,bTeam,'→ 平均每场新增 '+num(aTeam)+' 个铁粉进团，'+cmp(aTeam,bTeam)+'；比泛粉更值钱。',color);

    var topHtml='';

    if(w.length){

      /* 双榜并列：成交榜 + 涨粉榜（任一榜单该数据为 0 时该榜隐藏，但整体标题保留） */
      var top3Gmv=w.slice().sort(function(a,b){return (+b.gmv||0)-(+a.gmv||0);}).slice(0,3);
      var top3Fans=w.slice().sort(function(a,b){return (+b.fans||0)-(+a.fans||0);}).slice(0,3);
      var gmvHas=top3Gmv.some(function(s){return (+s.gmv||0)>0;});
      var fansHas=top3Fans.some(function(s){return (+s.fans||0)>0;});

      var renderBlock=function(list,key,unit,hasData){
        var inner='';
        if(!hasData){
          inner='<div style="font-size:11.5px;color:#94A3B8;padding:6px 0">暂无相关数据</div>';
        }else{
          list.forEach(function(s,i){
            var val=key==='gmv'?money(+s.gmv||0):(num(+s.fans||0)+(unit||''));
            inner+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-bottom:'+(i===2?'none':'1px solid #F1F3F8')+'">'
             +'<span style="width:18px;height:18px;flex:none;border-radius:5px;background:'+color+'18;color:'+color+';font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">'+(i+1)+'</span>'
             +'<span style="flex:1;color:#1B1D29;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(accName(s.acc))+'</span>'
             +'<span style="color:#94A3B8;font-size:11px;flex:none">'+esc((s.date||'').slice(5))+'</span>'
             +'<span style="font-weight:700;color:'+color+';flex:none;min-width:60px;text-align:right">'+val+'</span>'
             +'</div>';
          });
        }
        return '<div style="flex:1;min-width:0">'
         +'<div style="font-size:11.5px;font-weight:700;color:#1B1D29;margin-bottom:4px">按'+(key==='gmv'?'成交金额':'新增粉丝')+'排</div>'
         +inner+'</div>';
      };

      topHtml='<div style="margin-top:13px;border-top:1px dashed #E2E5F0;padding-top:10px">'
       +'<div style="font-size:12px;font-weight:700;color:#1B1D29;margin-bottom:8px">近 7 天 TOP 3 场次</div>'
       +'<div style="display:flex;gap:16px;flex-wrap:wrap">'
       +renderBlock(top3Gmv,'gmv','元',gmvHas)
       +renderBlock(top3Fans,'fans',' 粉',fansHas)
       +'</div></div>';

    }

    h+='<div class="kpis">'+cards+'</div>'+topHtml+'</div>';

  };

  catCard('zy',CAT_LABEL.zy,CAT_COLOR.zy,w7zy,p7zy);

  catCard('zy2',CAT_LABEL.zy2,CAT_COLOR.zy2,w7zy2,p7zy2);



  /* 账号筛选：trendAcc='' 表示全部账号；选中的账号若已被删则自动回落到全部 */
  if(trendAcc&&!accById(trendAcc))trendAcc='';

  var recentAll=trendAcc?all.filter(function(s){return s.acc===trendAcc;}):all;

  var recent=recentAll.slice(0,12).reverse();

  var labels=recent.map(function(s){return s.date.slice(5);});

  var pts=recent.map(function(s){return +s[chartMetric]||0;});

  var mbtn='';

  for(var k in METRICS){mbtn+='<button class="btn sm '+(chartMetric===k?'pri':'ghost')+'" onclick="chartMetric=\''+k+'\';render()">'+METRICS[k].n+'</button>';}

  var accOpt='<option value="">全部账号</option>';

  DB.accounts.slice().sort(function(a,b){return (a.name||'')<(b.name||'')?-1:1;}).forEach(function(a){

    accOpt+='<option value="'+a.id+'"'+(trendAcc===a.id?' selected':'')+'>'+esc(a.name)+'</option>';

  });

  var accSel='<select onchange="setTrendAcc(this.value)" style="font-size:12px;padding:5px 8px;border:1px solid #E2E5F0;border-radius:8px;background:#fff;color:#1B1D29;max-width:150px">'+accOpt+'</select>';

  var trendTitle=trendAcc?('近 12 场趋势 · '+esc((accById(trendAcc)||{}).name||'')):'近 12 场趋势';

  h+='<div class="card"><div class="card-h"><div class="ic">'+svg('grid')+'</div><h2>'+trendTitle+'</h2></div>'

   +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 2px 10px">'+accSel+'<span class="sub" style="margin:0">切换指标：</span>'+mbtn+'</div>'

   +lineChart(pts,labels,METRICS[chartMetric].c,METRICS[chartMetric].u)

   +'<div class="legend"><span><i style="background:'+METRICS[chartMetric].c+'"></i>'+METRICS[chartMetric].n+'</span><span>共 '+recentAll.length+' 场 · 数据点悬停可看具体数值</span></div></div><div class="sp"></div>';



  // 账号对比按类目分两组（byAccOf 已在前面定义）

  var cols=['#4F46E5','#7C6BF0','#0EA5E9','#16A34A','#D97706','#EC4899','#64748B','#14B8A6','#F59E0B','#8B5CF6','#06B6D4','#A855F7'];

  var accBar=function(cats,label,color){

    var arr=[];(Array.isArray(cats)?cats:[cats]).forEach(function(c){arr=arr.concat(byAccOf(c));});

    if(!arr.length)return '';

    var arrM=arr.filter(function(x){return +x.gmvMonth>0;}).sort(function(a,b){return b.gmvMonth-a.gmvMonth;});

    var mTot=arrM.reduce(function(s,x){return s+(+x.gmvMonth||0);},0);

    var head='<div class="card"><div class="card-h"><div class="ic" style="background:'+color+'20;color:'+color+'">'+svg('shield')+'</div><h2 style="color:'+color+'">'+label+' · 本月成交额（各账号）</h2>'+(arrM.length?'<span class="pill grey">合计 '+money(mTot)+'</span>':'')+'</div>';

  var pieItems=Object.keys(gmvAcc).map(function(k,i){return {n:accName(k),v:gmvAcc[k],c:cols[i%cols.length]};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});

  all.forEach(function(s){var k=(s.date||'').slice(0,7); if(k)gmvByMonth[k]=(gmvByMonth[k]||0)+(+s.gmv||0);});

  /* 固定显示 2026 年 1-12 月，不再滚动。年份从数据里推断，找不到就回 2026。 */
  var dataYears={};all.forEach(function(s){var y=(s.date||'').slice(0,4);if(/^\d{4}$/.test(y))dataYears[y]=1;});

  var mKeys=[];for(var mm=1;mm<=12;mm++)mKeys.push(year+'-'+(mm<10?'0':'')+mm);

  var mPts=mKeys.map(function(k){return gmvByMonth[k]||0;});

  return h;

}

/* 饼图（环形）：items=[{n,v,c}]，中心显本月合计，右侧图例列各账号金额+占比 */
function pieChart(items){
  var total=(items||[]).reduce(function(a,b){return a+(+b.v||0);},0);
  if(!(items||[]).length||total<=0)return '<div class="empty">'+svg('inbox')+'本月暂无成交数据</div>';
  var cx=115,cy=115,r=92,r2=58,a0=-Math.PI/2,seg='';
  items.forEach(function(it){
    var frac=(+it.v||0)/total,a1=a0+frac*Math.PI*2;
    if(frac>=0.9999){
      seg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r+r2)/2)+'" fill="none" stroke="'+it.c+'" stroke-width="'+(r-r2)+'"><title>'+esc(it.n)+'：'+money(it.v)+'（100%）</title></circle>';
    }else{
      var lg=frac>0.5?1:0;
      var x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      var u1=cx+r2*Math.cos(a1),v1=cy+r2*Math.sin(a1),u0=cx+r2*Math.cos(a0),v0=cy+r2*Math.sin(a0);
      seg+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 '+lg+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+u1.toFixed(1)+' '+v1.toFixed(1)+' A'+r2+' '+r2+' 0 '+lg+' 0 '+u0.toFixed(1)+' '+v0.toFixed(1)+' Z" fill="'+it.c+'" stroke="#fff" stroke-width="1.5"><title>'+esc(it.n)+'：'+money(it.v)+'（'+(frac*100).toFixed(1)+'%）</title></path>';
    }
    a0=a1;
  });
  var fmtT=total>=10000?(total/10000).toFixed(2)+'万':Math.round(total);
  var legend=items.map(function(it){var f=(+it.v||0)/total;return '<span style="width:100%"><i style="background:'+it.c+'"></i>'+esc(it.n)+' <b>'+money(it.v)+'</b>（'+(f*100).toFixed(1)+'%）</span>';}).join('');
  return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:4px 2px">'
   +'<div style="flex:0 0 auto;width:200px"><svg viewBox="0 0 230 230" preserveAspectRatio="xMidYMid meet">'+seg
   +'<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="11" fill="#8A90A8">本月合计</text>'
   +'<text x="'+cx+'" y="'+(cy+17)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#3B3F55">'+fmtT+'</text></svg></div>'
   +'<div class="legend" style="flex:1;min-width:200px;flex-direction:column;align-items:stretch;gap:6px">'+legend+'</div></div>';
}

/* 2026-09-10 师兄拍板：数字上移、说明沉底（同总览分类卡互换，说明单独一行右对齐） */
function kpi(l,v,d){return '<div class="kpi"><div class="v">'+v+'</div><div class="l"><span class="kl">'+esc(l)+'</span>'+(d?'<span class="d">'+d+'</span>':'')+'</div></div>';}

/* 带「本周 vs 上周」对比条 + 人话结论的 KPI 卡（类目统计专用） */
function kpi2(l,v,cur,prev,note,color){
  cur=+cur||0;prev=+prev||0;
  var dt,dc;
  if(!prev){dt='上周无可比数据';dc='#94A3B8';}
  else{var pc=(cur-prev)/prev*100;dt=(pc>0?'↑ +':'↓ ')+pc.toFixed(1)+'%';dc=pc>0?'#16A34A':(pc<0?'#DC2626':'#94A3B8');}
  var mx=Math.max(cur,prev,1);
  var wA=Math.max(4,Math.round(cur/mx*100)),wB=Math.max(4,Math.round(prev/mx*100));
  var bar=function(w2,fill){return '<svg width="100%" height="6" viewBox="0 0 100 6" preserveAspectRatio="none" style="flex:1;display:block"><rect x="0" y="0" width="100" height="6" rx="3" fill="#EEF0F6"/><rect x="0" y="0" width="'+w2+'" height="6" rx="3" fill="'+fill+'"/></svg>';};
  return '<div class="kpi">'
   +'<div class="l">'+esc(l)+'</div>'
   +'<div class="v">'+v+'</div>'
   +'<div class="d" style="color:'+dc+';font-weight:600">'+dt+'</div>'
   +'<div style="margin-top:7px;display:flex;flex-direction:column;gap:4px">'
   +'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:9.5px;color:#94A3B8;width:26px;flex:none">本周</span>'+bar(wA,color)+'</div>'
   +'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:9.5px;color:#94A3B8;width:26px;flex:none">上周</span>'+bar(wB,'#C7CBD8')+'</div>'
   +'</div>'
   +'<div style="font-size:11px;color:#64748B;margin-top:7px;line-height:1.5">'+note+'</div>'
   +'</div>';
}

/* 全部账号：按自然日聚合，取每日各账号均值，返回按日期降序的"合成场次"数组 */

function aggByDate(sessions){

  var byDate={};

  sessions.forEach(function(s){ (byDate[s.date]=byDate[s.date]||[]).push(s); });

  var dates=Object.keys(byDate).sort(function(a,b){return a<b?1:-1;});

  var numK=['views','fans','peak','avgOnline','enter','expose','teamAdd'];

  var rateK=['flowRec','expViewRate','viewFanRate','viewInterRate','flowFollow','flowShort','flowSearch'];

  return dates.map(function(d){

    var arr=byDate[d];

    var o={date:d,liveTime:arr[0].liveTime,dur:arr[0].dur};

    numK.forEach(function(k){o[k]=Math.round(arr.reduce(function(s,x){return s+(+x[k]||0);},0)/arr.length);});

    rateK.forEach(function(k){

      var vs=arr.map(function(x){return parseFloat(x[k]);}).filter(function(v){return !isNaN(v);});

      o[k]=vs.length?Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length*100)/100:0;

    });

    return o;

  });

}

      +'<div style="font-size:14px;color:#000;margin-top:4px">近7天峰值 '+num(s.v7)+'</div>'

function ensureAcc(name){

  name=(name||'').trim();

  if(!name)return DB.accounts.length?DB.accounts[0].id:null;

  var nk=normK(name);

  for(var i=0;i<DB.accounts.length;i++)if(normK(DB.accounts[i].name)===nk||normK(DB.accounts[i].sheet)===nk)return DB.accounts[i].id;

  var a={id:uid(),name:name,sheet:name,operator:'',plat:'抖音',auth:'ok',lastGuard:today(),liveTime:'',guard:'',auto:'',week:[],note:'粘贴导入自动创建'};

  DB.accounts.push(a);return a.id;

}

function normDate(s){

  s=(s||'').trim();

  var m=s.match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);

  if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);

  m=s.match(/^(\d{1,2})[-\/月.](\d{1,2})/);

  if(m)return (new Date().getFullYear())+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);

  return '';

}

function toNum(v){var n=String(v==null?'':v).replace(/[,¥￥\s元人单次%]/g,'');

  if(/万/.test(n))return Math.round(parseFloat(n)*10000)||0;

  return Math.round(parseFloat(n))||0;}

function doPaste(){

  var txt=val('pasteBox');

  if(!txt){toast('先粘贴内容');return;}

  var recs=[];

  try{

    if(/^[\[{]/.test(txt)){

      var j=JSON.parse(txt);recs=Array.isArray(j)?j:[j];

    }else{

      var lines=txt.split(/\r?\n/).filter(function(l){return l.trim();});

      var sep=lines[0].indexOf('\t')>=0?'\t':((lines[0].split(',').length>=4)?',':null);

      if(sep){

        var first=lines[0].split(sep).map(function(x){return x.trim();});

        var isHead=first.some(function(x){return HEAD[x];});

        var map=isHead?first.map(function(x){return HEAD[x]||null;}):['date','acc','liveTime','peak','enter','expose','views','fans'];

        (isHead?lines.slice(1):lines).forEach(function(l){

          var c=l.split(sep),o={};

          c.forEach(function(v,i){if(map[i])o[map[i]]=v.trim();});

          recs.push(o);

        });

      }else{

        var o={};

        lines.forEach(function(l){

          var m=l.split(/[:：]\s*|\s{2,}|\t/);

          if(m.length>=2){var k=m[0].trim();if(HEAD[k])o[HEAD[k]]=m.slice(1).join(' ').trim();}

        });

        if(Object.keys(o).length)recs.push(o);

      }

    }

  }catch(e){toast('解析失败：'+e.message);return;}

  if(!recs.length){toast('没有识别到有效数据，检查一下格式');return;}

  var n=0;

  recs.forEach(function(o){

    var d=normDate(o.date)||today();

    var accId=ensureAcc(o.acc);

    if(!accId)return;

    var ex=DB.sessions.filter(function(s){return s.date===d&&s.acc===accId;})[0];

    var s=ex||{id:uid(),date:d,acc:accId,video:'',audio:'',doc:'',note:'',review:{done:false,highlight:'',problem:'',next:'',updated:''}};

    s.weekday=o.weekday||s.weekday||'';s.liveTime=o.liveTime||s.liveTime||'';s.dur=o.dur||s.dur||'';

    NUM_KEYS.forEach(function(k){ if(o[k]!=null&&o[k]!=='')s[k]=toNum(o[k]); else s[k]=s[k]||0; });

    ['expViewRate','viewFanRate','viewInterRate','flowRec','flowFollow','flowHome','flowSearch','flowShort','flowToutiao','flowPaid','flowMall','conv','thousandGmv','fanRatio','product'].forEach(function(k){ if(o[k]!=null&&o[k]!=='')s[k]=o[k]; });

    if(o.note)s.note=o.note;

    if(!ex)DB.sessions.push(s);

    n++;

  });

  save();closeModal();render();toast('已导入/更新 '+n+' 条场次数据');

}



/* ============ 视图：账号守护 ============ */

/* 时长文本 -> 分钟，支持「1小时38分」「20分」「50秒」「2小时」 */
function durToMin(v){
  if(!v)return 0;
  var s=String(v),r=0,a;
  if((a=s.match(/(\d+)\s*小时/)))r+=(+a[1])*60;
  if((a=s.match(/(\d+)\s*分/)))r+=(+a[1]);
  if((a=s.match(/(\d+)\s*秒/)))r+=(+a[1])/60;
  return r;
}

/* 分钟 -> 时长文本，如 98 -> 「1小时38分」 */
function minToDur(mn){
  mn=Math.round(mn||0);
  if(!mn)return '—';
  if(mn<60)return mn+'分';
  var h=Math.floor(mn/60),m=mn%60;
  return m?(h+'小时'+m+'分'):(h+'小时');
}

/* 开播时间 + 时长 -> 下播时间文本：offTime('08:30:21','1小时23分') -> '09:53:21'；跨午夜加「次日」 */
function offTime(lt,dur){
  if(!lt||!dur)return '';
  var dm=durToMin(dur); if(dm<=0)return '';
  var p=String(lt).split(':'),H=(+p[0])||0,M=(+p[1])||0,S=(+p[2]||0);
  var tot=(H*60+M)*60+S+Math.round(dm*60);
  var nh=Math.floor(tot/3600),nm=Math.floor(tot%3600/60),ns=tot%3600%60,next=nh>=24;
  if(next)nh-=24;
  var pad=function(n){return(n<10?'0':'')+n;};
  return '下播 '+(next?'次日 ':'')+pad(nh)+':'+pad(nm)+':'+pad(ns);
}

/* ===== 账号粉丝量 / 粉丝团人数（2026-09-05 师兄定：填基线 + 每日新增自动累加）=====
   数据源说明：主表导出时已按「账号+日期+开播时间」去重（export_workbench_data.py），
   所以这里直接累加 s.fans / s.teamAdd 不会重复计数。
   口径：基线 = 师兄填的「截至 baseDate（含当天）」的总量；
        之后（date > baseDate）每场的新增粉丝 / 新加团累加进去。
   注意：基线当天已播的场次不算增量（师兄看到的数已含）——若早上填基线、当天还要播，
        那场会漏；发现偏差时改一次基线数字+日期即可校准。 */
function accStock(a){
  var bd=a.baseDate||'';
  var fb=(a.fanBase==null?0:+a.fanBase)||0;
  var cb=(a.clubBase==null?0:+a.clubBase)||0;
  var fi=0,ci=0,n=0;
  if(bd){
    var arr=(DB.sessions||[]).concat(DB.sessionsArch||[]);
    arr.forEach(function(s){
      if(s.acc!==a.id)return;
      if(!s.date||s.date<=bd)return;
      fi+=+s.fans||0; ci+=+s.teamAdd||0; n++;
    });
  }
  var has=(a.fanBase!=null||a.clubBase!=null)&&!!bd;
  return {fan:fb+fi, club:cb+ci, fanBase:fb, clubBase:cb, fanInc:fi, clubInc:ci, n:n, has:has, baseDate:bd};
}

    var avgDur7=d7.length?minToDur(d7.map(function(s){return durToMin(s.dur);}).reduce(function(x,y){return x+y;},0)/d7.length):'—';

  if(guardFilter==='all'){
